<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muscu</title>
<meta name="description" content="Suivi de musculation personnel, hors ligne.">
<meta name="theme-color" content="#0a0907">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* =====================================================================
   Muscu 2.0 — « Or & Onyx »
   Noir chaud profond, or brossé, verre dépoli façon iOS 26.
   Une colonne pour le pouce ; barre d'onglets flottante ; îlot dynamique.
   ===================================================================== */
[hidden] { display: none !important; }
:root {
  --bg: #0a0907;
  --bg-glow: rgba(214, 160, 60, 0.13);
  --surface: #15130f;
  --surface-hi: #1b1813;
  --surface-2: #221e17;
  --surface-3: #2d281f;
  --fg: #f8f4ea;
  --muted: #a49d8e;
  --faint: #6d665a;
  --line: rgba(255, 233, 190, 0.075);
  --line-strong: rgba(255, 233, 190, 0.13);

  --gold: #f0c35a;
  --gold-hi: #ffe8a6;
  --gold-2: #d9a23a;
  --gold-deep: #a8761f;
  --gold-text: #f4cc6e;
  --gold-ink: #1d1505;
  --grad-gold: linear-gradient(140deg, #fff0bf 0%, #f5cf6b 28%, #e0aa3e 64%, #b27c22 100%);
  --grad-gold-soft: linear-gradient(140deg, rgba(255, 224, 140, 0.20), rgba(214, 156, 50, 0.08));
  --accent: var(--gold);
  --accent-text: var(--gold-text);
  --accent-ink: var(--gold-ink);
  --accent-soft: rgba(240, 195, 90, 0.14);
  --accent-softer: rgba(240, 195, 90, 0.07);

  --good: #3fd98a;
  --bad: #ff5f5f;
  --warm: #ff9f43;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  --shadow-gold: 0 10px 30px rgba(230, 170, 60, 0.28);
  --glass: rgba(26, 23, 18, 0.64);
  --glass-border: rgba(255, 240, 210, 0.10);

  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

  --r-card: 26px;
  --r-ctl: 16px;
  --gutter: 16px;
  --tabbar-h: 64px;
  --tabbar-gap: max(10px, calc(env(safe-area-inset-bottom, 0px) - 12px));
  --spring: cubic-bezier(.32, 1.28, .5, 1);
  --ease: cubic-bezier(.25, .8, .25, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f2ea; --bg-glow: rgba(230, 180, 70, 0.20); --surface: #ffffff; --surface-hi: #ffffff; --surface-2: #f1ece1; --surface-3: #e7e0d1;
    --fg: #16130d; --muted: #7b7466; --faint: #b0a898; --line: rgba(60, 40, 10, 0.08); --line-strong: rgba(60, 40, 10, 0.14);
    --gold-text: #9a690b; --accent-soft: rgba(214, 160, 40, 0.15); --accent-softer: rgba(214, 160, 40, 0.08);
    --good: #18a35e; --bad: #e5484d; --warm: #e07b12; --scrim: rgba(30, 22, 8, 0.35);
    --shadow: 0 16px 44px rgba(60, 40, 10, 0.14); --shadow-gold: 0 10px 26px rgba(200, 140, 30, 0.30);
    --glass: rgba(255, 252, 245, 0.72); --glass-border: rgba(60, 40, 10, 0.08);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f2ea; --bg-glow: rgba(230, 180, 70, 0.20); --surface: #ffffff; --surface-hi: #ffffff; --surface-2: #f1ece1; --surface-3: #e7e0d1;
  --fg: #16130d; --muted: #7b7466; --faint: #b0a898; --line: rgba(60, 40, 10, 0.08); --line-strong: rgba(60, 40, 10, 0.14);
  --gold-text: #9a690b; --accent-soft: rgba(214, 160, 40, 0.15); --accent-softer: rgba(214, 160, 40, 0.08);
  --good: #18a35e; --bad: #e5484d; --warm: #e07b12; --scrim: rgba(30, 22, 8, 0.35);
  --shadow: 0 16px 44px rgba(60, 40, 10, 0.14); --shadow-gold: 0 10px 26px rgba(200, 140, 30, 0.30);
  --glass: rgba(255, 252, 245, 0.72); --glass-border: rgba(60, 40, 10, 0.08);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); min-height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.4; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
/* Halo doré fixe derrière le haut de l'écran */
body::before {
  content: ""; position: fixed; inset: 0 0 auto 0; height: 420px; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 70% at 50% -10%, var(--bg-glow), transparent 70%);
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { touch-action: manipulation; cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
svg { display: block; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.gold-text { color: var(--gold-text); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Structure ----------
   CORRECTIF barre d'onglets : sur iPhone en mode app (barre d'état translucide),
   quand la page est plus courte que l'écran, WebKit calcule les éléments
   « fixed bottom » sur une fenêtre raccourcie → un vide apparaît sous la barre
   (c'était le cas de Séances et Historique, pages courtes). On garantit donc
   que le document dépasse toujours d'au moins 1 px la hauteur de l'écran. */
#app { min-height: calc(100vh + 1px); min-height: calc(100lvh + 1px); overflow-x: hidden; overflow-x: clip; }
.page {
  padding-inline: var(--gutter);
  padding-block: 2px calc(var(--tabbar-h) + var(--tabbar-gap) + 36px);
  display: flex; flex-direction: column; gap: 14px;
  max-width: 640px; margin: 0 auto;
}
.page.no-tabbar { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); }
.page > * { min-width: 0; }

/* Animations de navigation (pousser / revenir / changer d'onglet) */
.anim-push { animation: push-in 0.42s var(--ease) both; }
.anim-pop { animation: pop-in 0.42s var(--ease) both; }
.anim-tab { animation: tab-in 0.34s var(--ease) both; }
@keyframes push-in { from { transform: translateX(38%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop-in { from { transform: translateX(-24%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes tab-in { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Barre de navigation (titre large qui se replie) ---------- */
.nav {
  position: sticky; top: 0; z-index: 25;
  padding-top: env(safe-area-inset-top, 0px);
  transition: background 0.25s, box-shadow 0.25s, -webkit-backdrop-filter 0.25s, backdrop-filter 0.25s;
}
body.scrolled .nav, .nav.solid {
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
  box-shadow: 0 1px 0 var(--line);
}
.nav-bar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  min-height: 48px; padding: 2px 6px; max-width: 640px; margin: 0 auto;
}
.nav-title {
  margin: 0; font-size: 17px; font-weight: 650; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 58vw; transition: opacity 0.2s, transform 0.25s var(--ease);
}
.nav.large .nav-title { opacity: 0; transform: translateY(6px); }
body.collapsed .nav.large .nav-title { opacity: 1; transform: none; }
.nav .left { justify-self: start; display: flex; }
.nav .right { justify-self: end; display: flex; gap: 2px; align-items: center; }
.large-title { padding: 0 var(--gutter) 8px; max-width: 640px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.large-title h1 { margin: 0; font-size: 34px; line-height: 1.08; font-weight: 800; letter-spacing: -0.035em; text-wrap: balance; }
.large-title .subtitle { margin: 3px 0 0; font-size: 15px; color: var(--muted); font-weight: 500; }
.large-title .eyebrow-date { margin: 0 0 2px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold-text); }
.large-title .brand { width: 42px; height: 42px; border-radius: 12px; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,0.35), 0 0 0 1px var(--line); overflow: hidden; }
.large-title .brand img { width: 100%; height: 100%; display: block; }

.bar-btn {
  min-width: 44px; min-height: 44px; padding: 0 10px; border: 0; background: none;
  color: var(--gold-text); font-size: 17px; font-weight: 500; display: inline-flex; align-items: center; gap: 2px; border-radius: 22px;
  transition: opacity 0.15s, transform 0.2s var(--spring);
}
.bar-btn.strong { font-weight: 700; }
.bar-btn.icon { padding: 0; justify-content: center; }
.bar-btn svg { width: 24px; height: 24px; }
.bar-btn:active { opacity: 0.5; transform: scale(0.94); }
.bar-btn.glassy {
  min-width: 40px; min-height: 40px; margin: 2px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
}
.bar-btn.glassy svg { width: 20px; height: 20px; }
.bar-btn.pill { background: var(--grad-gold); color: var(--gold-ink); min-height: 36px; padding: 0 16px; font-size: 15px; font-weight: 700; margin-right: 6px; box-shadow: var(--shadow-gold); }

/* ---------- Barre d'onglets flottante (verre) ---------- */
.tabbar-fade {
  position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabbar-h) + var(--tabbar-gap) + 40px); z-index: 29; pointer-events: none;
  background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--bg) 88%, transparent) 70%);
}
.tabbar {
  position: fixed; z-index: 30; left: 50%; bottom: var(--tabbar-gap); transform: translateX(-50%);
  width: min(calc(100% - 28px), 420px); height: var(--tabbar-h);
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px;
  border-radius: 999px; background: var(--glass);
  -webkit-backdrop-filter: saturate(190%) blur(26px); backdrop-filter: saturate(190%) blur(26px);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.42), inset 0 0 0 1px var(--glass-border), inset 0 1px 0 rgba(255, 255, 255, 0.07);
}
.tabbar .indicator {
  position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 4);
  border-radius: 999px; background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(240, 195, 90, 0.16);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 0.5s var(--spring);
}
.tab {
  position: relative; border: 0; background: none; color: var(--muted); border-radius: 999px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 10.5px; font-weight: 650; letter-spacing: 0;
  transition: color 0.25s, transform 0.25s var(--spring);
}
.tab svg { width: 25px; height: 25px; }
.tab .ic-on { display: none; }
.tab[aria-current="page"] { color: var(--gold-text); }
.tab[aria-current="page"] .ic-on { display: block; }
.tab[aria-current="page"] .ic-off { display: none; }
.tab:active { transform: scale(0.9); }

/* ---------- Cartes & typographie ---------- */
.card {
  position: relative; background: linear-gradient(180deg, var(--surface-hi), var(--surface));
  border-radius: var(--r-card); padding: 18px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: inset 0 0 0 1px var(--line);
}
button.card { border: 0; text-align: left; width: 100%; transition: transform 0.25s var(--spring); }
button.card:active { transform: scale(0.98); }
.card.flush { padding: 4px 0; gap: 0; overflow: hidden; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.eyebrow svg { width: 14px; height: 14px; }
.eyebrow.accent { color: var(--gold-text); }
.h-hero { margin: 0; font-family: var(--font-num); font-size: 42px; line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; overflow-wrap: anywhere; }
.h2 { margin: 0; font-size: 21px; font-weight: 750; letter-spacing: -0.02em; }
.h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }
.p { margin: 0; color: var(--muted); font-size: 15px; }
.small { font-size: 13px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.section-label { margin: 12px 6px -4px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.footnote { margin: -4px 8px 0; font-size: 13px; color: var(--muted); line-height: 1.45; }

/* Carte héros (séance suggérée) */
.hero {
  overflow: hidden; padding: 22px 20px 20px; gap: 14px;
  background:
    radial-gradient(130% 90% at 100% 0%, rgba(240, 190, 80, 0.22), transparent 55%),
    linear-gradient(180deg, var(--surface-hi), var(--surface));
  box-shadow: inset 0 0 0 1px rgba(240, 195, 90, 0.16), 0 20px 50px rgba(0, 0, 0, 0.35);
}
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; pointer-events: none;
  border: 26px solid rgba(240, 195, 90, 0.06);
}
.hero .ex-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hero .ex-chips span { padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg); font-size: 13px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.hero .ex-chips span.more { color: var(--muted); }
.hero .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 14px; font-weight: 500; }
.hero .meta span { display: inline-flex; align-items: center; gap: 5px; }
.hero .meta svg { width: 15px; height: 15px; color: var(--gold-text); }

/* Bandeau semaine (L M M J V S D) */
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.day small { font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: 0.04em; }
.day .dot {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num);
  font-size: 14px; font-weight: 700; color: var(--muted); background: var(--surface-2);
}
.day.done .dot { background: var(--grad-gold); color: var(--gold-ink); box-shadow: 0 4px 14px rgba(230, 170, 60, 0.32); }
.day.done .dot svg { width: 16px; height: 16px; }
.day.today small { color: var(--gold-text); }
.day.today:not(.done) .dot { box-shadow: inset 0 0 0 2px var(--gold); color: var(--fg); }
.day.future .dot { opacity: 0.5; }

/* Boutons */
.btn {
  position: relative; overflow: hidden;
  border: 0; border-radius: 20px; min-height: 58px; padding: 0 22px; width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
  background: var(--grad-gold); color: var(--gold-ink);
  box-shadow: var(--shadow-gold), inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -2px 0 rgba(120, 70, 0, 0.18);
  transition: transform 0.25s var(--spring), opacity 0.2s, filter 0.2s;
}
.btn::after { /* reflet qui passe */
  content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent);
  transform: skewX(-18deg); animation: shine 4.5s ease-in-out 1.2s infinite;
}
.btn:active { transform: scale(0.965); filter: brightness(0.95); }
.btn[disabled] { opacity: 0.35; pointer-events: none; }
.btn.secondary { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.btn.secondary::after, .btn.ghost::after, .btn.danger::after, .btn.danger-fill::after { display: none; }
.btn.ghost { background: none; color: var(--gold-text); min-height: 48px; box-shadow: none; }
.btn.danger { background: none; color: var(--bad); min-height: 48px; box-shadow: none; }
.btn.danger-fill { background: var(--bad); color: #fff; box-shadow: 0 10px 26px rgba(255, 80, 80, 0.25); }
.btn svg { width: 20px; height: 20px; }
.btn.play svg { width: 18px; height: 18px; }
@keyframes shine { 0%, 70% { left: -60%; } 100% { left: 130%; } }

.chip-btn {
  border: 0; border-radius: 999px; min-height: 34px; padding: 0 13px; background: var(--accent-soft); color: var(--gold-text);
  font-size: 14px; font-weight: 650; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: transform 0.2s var(--spring), opacity 0.15s;
}
.chip-btn svg { width: 15px; height: 15px; }
.chip-btn:active { transform: scale(0.93); opacity: 0.8; }

/* Tuiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { background: var(--surface-2); border-radius: 18px; padding: 12px 13px; min-width: 0; display: flex; flex-direction: column; gap: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .k svg { width: 14px; height: 14px; color: var(--gold-text); flex: none; }
.tile .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 750; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.gold { background: var(--grad-gold-soft); box-shadow: inset 0 0 0 1px rgba(240, 195, 90, 0.18); }

/* Badge record : or champagne avec reflet */
.badge-pr {
  position: relative; overflow: hidden;
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px 4px 7px; border-radius: 999px;
  background: var(--grad-gold); color: var(--gold-ink); font-size: 12px; font-weight: 850; letter-spacing: 0.02em; white-space: nowrap; flex: none;
  box-shadow: 0 4px 12px rgba(230, 170, 60, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.badge-pr::after { content: ""; position: absolute; inset: 0 auto 0 -50%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.7), transparent); transform: skewX(-20deg); animation: shine 3.2s ease-in-out infinite; }
.badge-pr svg { width: 12px; height: 12px; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface-3); color: var(--muted); font-size: 11px; font-weight: 700; vertical-align: 2px; }

.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 2px 7px 2px 5px; border-radius: 999px; }
.delta svg { width: 12px; height: 12px; stroke-width: 2.6; }
.delta.up { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
.delta.down { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
.delta.flat { color: var(--muted); background: var(--surface-3); padding: 2px 5px; }

.delta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.delta-cell { background: var(--surface-2); border-radius: 16px; padding: 10px 11px; min-width: 0; box-shadow: inset 0 0 0 1px var(--line); }
.delta-cell .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.delta-cell .line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.delta-cell .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 750; }

/* Contrôle segmenté avec curseur glissant */
.segmented {
  position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--surface-2); border-radius: 13px; padding: 3px; box-shadow: inset 0 0 0 1px var(--line);
}
.segmented .thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n));
  border-radius: 10px; background: var(--surface-3); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25), inset 0 0 0 1px var(--line-strong);
  transform: translateX(calc(var(--i) * 100%)); transition: transform 0.45s var(--spring);
}
.segmented button { position: relative; z-index: 1; border: 0; background: none; border-radius: 10px; min-height: 32px; padding: 0 10px; font-size: 13.5px; font-weight: 650; color: var(--muted); white-space: nowrap; transition: color 0.2s; }
.segmented button[aria-pressed="true"] { color: var(--fg); }

/* Listes groupées */
.list-row { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 6px 8px 6px 14px; position: relative; }
.list-row + .list-row::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: 1px solid var(--line); }
.card.flush.plain .list-row + .list-row::before { left: 16px; }
.list-main { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 6px 0; display: flex; align-items: center; gap: 12px; border-radius: 14px; transition: opacity 0.15s; }
.list-main:active { opacity: 0.55; }
.list-main .txt { flex: 1; min-width: 0; }
.list-main .t { font-size: 17px; font-weight: 650; letter-spacing: -0.015em; overflow-wrap: anywhere; }
.list-main .s { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; }
.mono {
  width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
  font-family: var(--font-num); font-weight: 800; font-size: 15px; letter-spacing: -0.02em;
  background: var(--grad-gold); color: var(--gold-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 4px 12px rgba(230, 170, 60, 0.18);
}
.mono.dim { background: var(--surface-3); color: var(--muted); box-shadow: none; }
.mono svg { width: 20px; height: 20px; }
.mono.ic { background: var(--accent-soft); color: var(--gold-text); box-shadow: none; }
.mono.ic.red { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.chev { color: var(--faint); width: 16px; height: 16px; flex: none; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 14px; background: none; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center; flex: none; transition: background 0.15s, transform 0.2s var(--spring);
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { background: var(--surface-2); transform: scale(0.9); }
.icon-btn[disabled] { opacity: 0.25; }
.list-add { border: 0; background: none; color: var(--gold-text); font-weight: 650; min-height: 58px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 16px; text-align: left; position: relative; transition: opacity 0.15s; }
.list-add:active { opacity: 0.55; }
.list-add + .list-add::before, .list-row + .list-add::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: 1px solid var(--line); }
.list-add .mono { width: 36px; height: 36px; border-radius: 11px; }
.list-add .mono svg { width: 19px; height: 19px; }

.empty { text-align: center; padding: 52px 12px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty .glyph {
  width: 84px; height: 84px; border-radius: 26px; background: var(--grad-gold-soft); color: var(--gold-text); display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px rgba(240, 195, 90, 0.2), 0 18px 40px rgba(230, 170, 60, 0.12);
}
.empty .glyph svg { width: 40px; height: 40px; }
.empty .glyph.logo { background: none; box-shadow: 0 18px 40px rgba(0,0,0,0.45), 0 0 0 1px var(--line); overflow: hidden; width: 96px; height: 96px; border-radius: 24px; }
.empty .glyph.logo img { width: 100%; height: 100%; }
.empty h2 { margin: 8px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.empty .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; margin-top: 12px; }

/* Graphiques */
.chart { width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 10.5px; font-weight: 600; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .bar { fill: var(--surface-3); }
.chart .bar.on { fill: url(#gBar); opacity: 0.42; }
.chart .bar.now { fill: url(#gBar); opacity: 1; }
.chart .line { fill: none; stroke: url(#gLine); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 4px 8px rgba(230, 170, 60, 0.35)); }
.chart .area { fill: url(#gArea); }
.chart .pt { fill: var(--surface); stroke: var(--gold); stroke-width: 2.5; }
.chart .pt.pr { fill: var(--gold); stroke: var(--gold-hi); stroke-width: 2; filter: drop-shadow(0 0 6px rgba(255, 210, 110, 0.75)); }
.chart .pt.last { fill: var(--gold); }

/* Formulaires */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 13px; color: var(--muted); font-weight: 650; margin-left: 4px; }
.input {
  width: 100%; border: 0; border-radius: 16px; background: var(--surface-2); padding: 14px 15px; font-size: 17px; min-height: 52px;
  box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 0.2s;
}
.input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--gold); }
textarea.input { resize: none; min-height: 84px; line-height: 1.4; }
select.input { appearance: none; -webkit-appearance: none; background-image: none; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; }
.stepper + .stepper, .stepper + .setting-row { border-top: 1px solid var(--line); }
.stepper .lbl { font-size: 16px; color: var(--fg); font-weight: 500; }
.stepper .ctl { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.stepper .ctl button { width: 40px; height: 38px; border-radius: 11px; border: 0; background: none; font-size: 22px; font-weight: 500; color: var(--gold-text); transition: background 0.15s, transform 0.2s var(--spring); }
.stepper .ctl button:active { background: var(--surface-3); transform: scale(0.9); }
.stepper .ctl output { min-width: 36px; text-align: center; font-family: var(--font-num); font-size: 19px; font-weight: 750; font-variant-numeric: tabular-nums; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.card > .setting-row + .setting-row { border-top: 1px solid var(--line); }
.setting-row > span { font-size: 16px; display: flex; align-items: center; gap: 12px; }
.setting-row .mono { width: 32px; height: 32px; border-radius: 9px; }
.setting-row .mono svg { width: 17px; height: 17px; }
.setting-row select { width: auto; min-width: 104px; min-height: 38px; padding: 7px 12px; text-align: right; color: var(--gold-text); font-weight: 650; }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--surface-3); border: 0; flex: none; transition: background 0.25s; box-shadow: inset 0 0 0 1px var(--line); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: transform 0.35s var(--spring), width 0.2s; }
.switch:active::after { width: 32px; }
.switch[aria-checked="true"] { background: var(--grad-gold); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch[aria-checked="true"]:active::after { transform: translateX(14px); }
.switch.warm[aria-checked="true"] { background: var(--warm); }
.suggest { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -18px; padding-inline: 18px; }
.suggest::-webkit-scrollbar { display: none; }

/* ---------- Séance en cours ---------- */
.session-head { flex-direction: row; align-items: center; gap: 16px; padding: 18px 20px; }
.session-head .ring-wrap { position: relative; width: 88px; height: 88px; flex: none; }
.session-head .ring-wrap svg { width: 88px; height: 88px; transform: rotate(-90deg); }
.session-head .ring-wrap circle { fill: none; stroke-width: 8; }
.session-head .ring-wrap .track { stroke: var(--surface-3); }
.session-head .ring-wrap .prog { stroke: url(#gRing); stroke-linecap: round; transition: stroke-dashoffset 0.6s var(--ease); }
.session-head .ring-wrap .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1; }
.session-head .ring-wrap .lbl b { font-family: var(--font-num); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.session-head .ring-wrap .lbl small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 700; margin-top: 3px; letter-spacing: 0.04em; }
.session-head .clock { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
.session-head .live { display: inline-flex; align-items: center; gap: 6px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(240, 195, 90, 0.6); animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240, 195, 90, 0.55); } 70% { box-shadow: 0 0 0 8px rgba(240, 195, 90, 0); } 100% { box-shadow: 0 0 0 0 rgba(240, 195, 90, 0); } }

.ex-card.complete { box-shadow: inset 0 0 0 1px rgba(240, 195, 90, 0.22); }
.ex-head { display: flex; align-items: flex-start; gap: 10px; }
.ex-head .idx { width: 30px; height: 30px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--font-num); font-weight: 800; font-size: 14px; background: var(--surface-3); color: var(--muted); margin-top: 1px; }
.ex-card.complete .ex-head .idx { background: var(--grad-gold); color: var(--gold-ink); }
.ex-card.complete .ex-head .idx svg { width: 16px; height: 16px; }
.ex-head .txt { flex: 1; min-width: 0; }
.ex-head h2 { margin: 0; font-size: 20px; font-weight: 750; letter-spacing: -0.02em; overflow-wrap: anywhere; line-height: 1.2; }
.ex-head p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-head .badge-pr { margin-top: 4px; }
.ex-head .icon-btn { margin: -8px -10px 0 0; }

.hint { display: flex; align-items: center; gap: 10px; background: var(--grad-gold-soft); border-radius: 16px; padding: 10px 10px 10px 12px; box-shadow: inset 0 0 0 1px rgba(240, 195, 90, 0.16); }
.hint .hi { width: 30px; height: 30px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--accent-soft); color: var(--gold-text); }
.hint .hi svg { width: 18px; height: 18px; }
.hint p { margin: 0; flex: 1; font-size: 14px; color: var(--fg); line-height: 1.35; }
.hint .chip-btn { background: var(--grad-gold); color: var(--gold-ink); font-weight: 750; }
.note { display: flex; gap: 8px; font-size: 14px; color: var(--muted); }
.note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

.sets-head { display: grid; grid-template-columns: 34px 1fr 1fr 60px; padding: 0 0 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
.sets-head span:last-child { text-align: center; }
.sets { display: flex; flex-direction: column; gap: 8px; }
.set-row {
  display: grid; grid-template-columns: 34px 1fr 60px; align-items: center; gap: 0;
  background: var(--surface-2); border-radius: 18px; padding-left: 4px; min-height: 64px;
  box-shadow: inset 0 0 0 1px var(--line);
  transition: background 0.35s, box-shadow 0.35s, transform 0.25s var(--spring);
}
.set-row.active { box-shadow: inset 0 0 0 1.5px rgba(240, 195, 90, 0.55), 0 6px 20px rgba(230, 170, 60, 0.10); }
.set-row.done { background: linear-gradient(100deg, rgba(240, 195, 90, 0.20), rgba(240, 195, 90, 0.07)); box-shadow: inset 0 0 0 1px rgba(240, 195, 90, 0.22); }
.set-label { font-weight: 800; font-size: 15px; color: var(--muted); text-align: center; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.set-row.done .set-label { color: var(--gold-text); }
.set-row.warm .set-label { color: var(--warm); }
.set-values { border: 0; background: none; display: grid; grid-template-columns: 1fr 1fr; align-items: center; min-height: 64px; text-align: left; padding: 0 4px; border-radius: 14px; }
.set-values:active { opacity: 0.6; }
.val { display: flex; align-items: baseline; gap: 4px; }
.val b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.val small { font-size: 12px; color: var(--muted); font-weight: 600; }
.val.ph b { color: var(--faint); }
.check { width: 60px; height: 64px; border: 0; background: none; display: grid; place-items: center; color: var(--faint); }
.check .c {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  box-shadow: inset 0 0 0 2.5px var(--surface-3); transition: transform 0.35s var(--spring), background 0.25s, box-shadow 0.25s;
}
.check .c svg { width: 20px; height: 20px; opacity: 0; transform: scale(0.4); transition: opacity 0.2s, transform 0.4s var(--spring); }
.set-row.active .check .c { box-shadow: inset 0 0 0 2.5px var(--gold); }
.set-row.done .check .c { background: var(--grad-gold); box-shadow: 0 4px 14px rgba(230, 170, 60, 0.4); color: var(--gold-ink); }
.set-row.done .check .c svg { opacity: 1; transform: none; stroke-width: 3; }
.set-row.just .check .c { animation: pop 0.5s var(--spring); }
.set-row.just { animation: glow 0.9s ease-out; }
.check:active .c { transform: scale(0.82); }
@keyframes glow { 0% { box-shadow: inset 0 0 0 1px rgba(240,195,90,.4), 0 0 0 0 rgba(240,195,90,.5); } 100% { box-shadow: inset 0 0 0 1px rgba(240,195,90,.22), 0 0 0 14px rgba(240,195,90,0); } }
.add-set { border: 0; background: none; color: var(--gold-text); font-weight: 650; font-size: 15px; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 14px; }
.add-set:active { background: var(--surface-2); }
.add-set svg { width: 18px; height: 18px; }

/* Barre de repos flottante */
.rest-bar {
  position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  max-width: 616px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 30px;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(190%) blur(26px); backdrop-filter: saturate(190%) blur(26px);
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5), inset 0 0 0 1px var(--glass-border), inset 0 1px 0 rgba(255,255,255,0.07);
  animation: rise 0.45s var(--spring);
}
.rest-bar .ring { width: 48px; height: 48px; flex: none; transform: rotate(-90deg); }
.rest-bar .ring circle { fill: none; stroke-width: 5; }
.rest-bar .ring .track { stroke: var(--surface-3); }
.rest-bar .ring .prog { stroke: url(#gRing); stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }
.rest-bar .time { flex: 1; min-width: 0; }
.rest-bar .time small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
.rest-bar .time b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.round-btn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 14px; font-weight: 750; display: grid; place-items: center; flex: none; font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 1px var(--line); transition: transform 0.25s var(--spring); }
.round-btn.accent { background: var(--grad-gold); color: var(--gold-ink); box-shadow: var(--shadow-gold), inset 0 1px 0 rgba(255,255,255,.5); }
.round-btn svg { width: 20px; height: 20px; }
.round-btn:active { transform: scale(0.88); }
.summary-bar { padding: 10px; }

.flash { position: fixed; inset: 0; z-index: 90; pointer-events: none; background: radial-gradient(circle at 50% 30%, rgba(255, 210, 110, 0.55), rgba(240, 180, 60, 0.15)); opacity: 0; animation: flash 1s ease-out; }

/* Confettis dorés (records) */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 95; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; background: var(--grad-gold); animation: fall var(--d, 2.4s) cubic-bezier(.2,.6,.4,1) var(--delay, 0s) forwards; opacity: 0.95; }
@keyframes fall { to { transform: translate3d(var(--x, 0), 110vh, 0) rotate(var(--r, 540deg)); opacity: 0.9; } }

/* ---------- Feuilles (bottom sheets) ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade 0.25s ease-out; border: 0; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.sheet {
  position: relative; width: calc(100% - 16px); max-width: 640px; max-height: 92%; margin-bottom: calc(8px + env(safe-area-inset-bottom, 0px) * 0.3);
  background: var(--surface-hi); border-radius: 34px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
  padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px) * 0.6);
  display: flex; flex-direction: column; gap: 14px; overflow-y: auto; overscroll-behavior: contain;
  animation: sheet-up 0.5s var(--spring);
  will-change: transform;
}
.sheet.dragging { transition: none !important; animation: none; }
.sheet .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--faint); opacity: 0.55; margin: 0 auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.sheet-head .icon-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); }
.sheet-head .icon-btn svg { width: 16px; height: 16px; stroke-width: 2.6; }
.sheet .msg { margin: -6px 0 0; color: var(--muted); font-size: 15px; }
.menu { display: flex; flex-direction: column; background: var(--surface-2); border-radius: 20px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.menu button { border: 0; background: none; min-height: 56px; padding: 0 16px; text-align: left; font-size: 17px; display: flex; align-items: center; gap: 12px; position: relative; }
.menu button:active { background: var(--surface-3); }
.menu button + button::before { content: ""; position: absolute; top: 0; left: 50px; right: 0; border-top: 1px solid var(--line); }
.menu button svg { width: 22px; height: 22px; color: var(--muted); }
.menu button.danger { color: var(--bad); }
.menu button.danger svg { color: var(--bad); }
.menu button.on { color: var(--gold-text); font-weight: 700; }
.menu button.on svg { color: var(--gold-text); }

.big-field { background: var(--surface-2); border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 1px var(--line); }
.big-field .lbl { text-align: center; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.big-input {
  width: 100%; border: 0; background: none; text-align: center; font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 60px; font-weight: 800; line-height: 1.05; padding: 0; letter-spacing: -0.035em; caret-color: var(--gold);
}
.big-input:focus { outline: none; }
.big-input::placeholder { color: var(--faint); }
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.steps button { border: 0; border-radius: 16px; min-height: 54px; background: var(--surface-hi); font-family: var(--font-num); font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 1px var(--line); transition: transform 0.2s var(--spring), background 0.15s; }
.steps button:active { transform: scale(0.92); background: var(--accent-soft); color: var(--gold-text); }

/* ---------- Toast (appareils sans îlot) ---------- */
.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 100; transform: translateX(-50%);
  background: #000; color: #fff; padding: 11px 18px 11px 14px; border-radius: 999px; font-size: 15px; font-weight: 650;
  display: flex; align-items: center; gap: 9px; box-shadow: 0 12px 30px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.08); max-width: calc(100% - 32px); white-space: nowrap;
  animation: drop 0.45s var(--spring);
}
.toast svg { width: 19px; height: 19px; flex: none; color: var(--gold); }

/* ---------- Îlot dynamique ----------
   Une capsule noire posée exactement sur l'îlot matériel de l'iPhone :
   elle s'étire de part et d'autre pour afficher le chrono, le repos,
   les records et les notifications, comme une Live Activity. */
.island {
  position: fixed; z-index: 120; left: 50%; top: var(--isl-top, 11px);
  width: var(--isl-w, 126px); height: var(--isl-h, 37px); transform: translateX(-50%);
  background: #000; color: #fff; border-radius: 999px; overflow: hidden;
  transition: width 0.55s var(--spring), height 0.55s var(--spring), border-radius 0.55s var(--spring), opacity 0.3s, box-shadow 0.4s;
  opacity: 0; pointer-events: none;
}
.island.on { opacity: 1; pointer-events: auto; }
.island.compact { --isl-w: 252px; }
.island.expanded { --isl-w: min(372px, calc(100vw - 20px)); --isl-h: 84px; border-radius: 42px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
.island.expanded.tall { --isl-h: 148px; border-radius: 48px; }
.island .lead, .island .trail {
  position: absolute; top: 0; height: var(--isl-h-c, 37px); display: flex; align-items: center; gap: 6px;
  font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 750; font-size: 15px; white-space: nowrap;
  transition: opacity 0.25s 0.15s;
}
.island .lead { left: 12px; }
.island .trail { right: 13px; color: var(--gold); }
.island .lead svg { width: 20px; height: 20px; color: var(--gold); }
.island .mini-ring { width: 22px; height: 22px; transform: rotate(-90deg); }
.island .mini-ring circle { fill: none; stroke-width: 3.2; }
.island .mini-ring .track { stroke: rgba(240, 195, 90, 0.22); }

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a0"/><stop offset="1" stop-color="#c98f2c"/></linearGradient>
  <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98024"/><stop offset="1" stop-color="#ffe29a"/></linearGradient>
  <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0c35a" stop-opacity=".34"/><stop offset="1" stop-color="#f0c35a" stop-opacity="0"/></linearGradient>
  <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffeab0"/><stop offset=".5" stop-color="#f0c35a"/><stop offset="1" stop-color="#c38a28"/></linearGradient>
</defs></svg>
<div id="app"></div>
<div class="island" id="island" role="status" aria-live="polite"></div>
<noscript>Muscu a besoin de JavaScript.</noscript>
<script>
'use strict';
(() => {
  /* =====================================================================
     Muscu (web app) — suivi de musculation, 100 % local et hors ligne.

     RÈGLE MÉTIER CRITIQUE : la progression se calcule par TYPE DE SÉANCE.
     Chaque exercice réalisé (sessionExercise) garde l'identifiant de
     l'exercice précis du type dont il vient (templateExerciseID). L'historique
     d'un exercice est lu par cet identifiant, jamais par son nom : deux
     « Développé incliné » dans Push A et Push B ont deux historiques séparés.

     Le format des données est identique à la sauvegarde JSON de l'app
     SwiftUI : les deux versions peuvent s'échanger leurs sauvegardes.
     ===================================================================== */

  // ---------------------------------------------------------------------
  // Utilitaires
  // ---------------------------------------------------------------------
  const uid = () => (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID().toUpperCase()
    : 'ID-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  const nowISO = () => new Date().toISOString();
  const ts = (iso) => new Date(iso).getTime();
  const EPS = 0.001;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const byOrder = (a, b) => a.orderIndex - b.orderIndex;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // ---------------------------------------------------------------------
  // État
  // ---------------------------------------------------------------------
  const DEFAULT_SETTINGS = { unit: 'kg', small: 1, large: 2.5, theme: 'system', restSound: true, installHintDismissed: false };
  const state = {
    data: { version: 1, templates: [], sessions: [] },
    settings: { ...DEFAULT_SETTINGS },
    rest: { endAt: null, duration: 0 },
    ui: {
      tab: 'home',
      stacks: { home: [], templates: [], history: [], settings: [] },
      sheet: null,
      summaryId: null,
      chosenTemplateId: null,
      reorder: false,
      statsVolume: false,
      metric: 'maxWeight',
      justSet: null,
    },
  };
  let dataVersion = 0;
  const D = () => state.data;
  const S = () => state.settings;

  // ---------------------------------------------------------------------
  // Persistance : IndexedDB (principal) + localStorage (copie de secours)
  // ---------------------------------------------------------------------
  const LS_KEY = 'muscu.state.v1';
  let idb = null;

  function idbOpen() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { reject(new Error('no idb')); return; }
      const req = indexedDB.open('muscu-db', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function idbGet() {
    return new Promise((resolve, reject) => {
      const req = idb.transaction('kv', 'readonly').objectStore('kv').get('state');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  function idbPut(value) {
    return new Promise((resolve, reject) => {
      const tx = idb.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, 'state');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadPersisted() {
    // On lit les deux copies et on garde la plus récente (IndexedDB peut être en retard
    // si l'app a été fermée juste après une modification).
    const candidates = [];
    try { idb = await idbOpen(); const v = await idbGet(); if (v) candidates.push(v); } catch (_) { idb = null; }
    try { const v = localStorage.getItem(LS_KEY); if (v) candidates.push(v); } catch (_) { /* rien */ }
    let best = null;
    for (const raw of candidates) {
      try {
        const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (!parsed.data || !Array.isArray(parsed.data.templates) || !Array.isArray(parsed.data.sessions)) continue;
        if (!best || String(parsed.savedAt || '') > String(best.savedAt || '')) best = parsed;
      } catch (_) { /* copie illisible : ignorée */ }
    }
    if (!best) return;
    state.data = best.data;
    if (best.settings) state.settings = { ...DEFAULT_SETTINGS, ...best.settings };
    if (best.rest) state.rest = best.rest;
  }

  let saveTimer = null;
  /** Copie localStorage immédiate (synchrone), IndexedDB groupé juste après. */
  function save() {
    const payload = snapshot();
    try { localStorage.setItem(LS_KEY, payload); } catch (_) { /* quota : IndexedDB suffit */ }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { if (idb) idbPut(snapshot()).catch(() => {}); }, 150);
  }
  function flush() {
    clearTimeout(saveTimer);
    const payload = snapshot();
    try { localStorage.setItem(LS_KEY, payload); } catch (_) { /* rien */ }
    if (idb) idbPut(payload).catch(() => {});
  }
  const snapshot = () => JSON.stringify({ data: state.data, settings: state.settings, rest: state.rest, savedAt: nowISO() });

  /** Toute modification des données passe par ici : sauvegarde + rendu. */
  function commit() {
    dataVersion += 1;
    save();
    render();
  }

  // ---------------------------------------------------------------------
  // Unités et mise en forme
  // ---------------------------------------------------------------------
  const LBS_PER_KG = 2.2046226218;
  const fromKg = (kg) => (S().unit === 'lbs' ? kg * LBS_PER_KG : kg);
  const toKg = (v) => (S().unit === 'lbs' ? v / LBS_PER_KG : v);
  const nf1 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 });
  const nf0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  const unitLabel = () => S().unit;
  const fmtW = (kg) => nf1.format(fromKg(kg));
  const fmtWU = (kg) => `${fmtW(kg)} ${unitLabel()}`;
  const fmtVol = (kg) => `${nf0.format(fromKg(kg))} ${unitLabel()}`;
  /** Volume court pour les tuiles étroites : « 4,3 t » au-delà de 1 000. */
  const fmtVolShort = (kg) => {
    const v = fromKg(kg);
    if (v < 1000) return `${nf0.format(v)} ${unitLabel()}`;
    return S().unit === 'lbs' ? `${nf1.format(v / 1000)} k lbs` : `${nf1.format(v / 1000)} t`;
  };
  const cap = (str) => (str ? str[0].toUpperCase() + str.slice(1) : str);
  const editNum = (v) => String(Math.round(v * 100) / 100).replace('.', ',');
  const parseNum = (t) => {
    const v = parseFloat(String(t ?? '').replace(',', '.').trim());
    return Number.isFinite(v) ? v : null;
  };

  function fmtDuration(ms) {
    const m = Math.max(0, Math.floor(ms / 60000));
    return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`;
  }
  function fmtClock(seconds) {
    const s = Math.max(0, Math.ceil(seconds));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  function fmtElapsed(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
  }
  function fmtRest(sec) {
    if (sec < 60) return `${sec} s`;
    const r = sec % 60;
    return r === 0 ? `${sec / 60} min` : `${Math.floor(sec / 60)} min ${r}`;
  }
  const rtf = new Intl.RelativeTimeFormat('fr', { numeric: 'auto' });
  function fmtRelative(iso) {
    const a = new Date(iso); a.setHours(0, 0, 0, 0);
    const b = new Date(); b.setHours(0, 0, 0, 0);
    const days = Math.round((a - b) / 86400000);
    if (days > -7) return rtf.format(days, 'day');
    if (days > -35) return rtf.format(Math.round(days / 7), 'week');
    return rtf.format(Math.round(days / 30), 'month');
  }
  const fmtDate = (iso, opts) => new Date(iso).toLocaleDateString('fr-FR', opts);
  const fmtDateLong = (iso) => fmtDate(iso, { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtDateShort = (iso) => fmtDate(iso, { day: 'numeric', month: 'short' });
  const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;

  // ---------------------------------------------------------------------
  // Accès aux données
  // ---------------------------------------------------------------------
  const tById = (id) => D().templates.find((t) => t.id === id) || null;
  const sById = (id) => D().sessions.find((s) => s.id === id) || null;
  const activeTemplates = () => D().templates.filter((t) => !t.isArchived).sort((a, b) => a.sortIndex - b.sortIndex);
  const orderedTE = (t) => t.exercises.filter((e) => !e.isArchived).sort(byOrder);
  const orderedSE = (s) => [...s.exercises].sort(byOrder);
  const orderedSets = (se) => [...se.sets].sort(byOrder);
  const isDone = (s) => !!s.endedAt;
  const completedSessions = () => D().sessions.filter(isDone).sort((a, b) => ts(b.startedAt) - ts(a.startedAt));
  const activeSession = () => D().sessions.filter((s) => !s.endedAt).sort((a, b) => ts(b.startedAt) - ts(a.startedAt))[0] || null;
  const templateSessions = (t) => completedSessions().filter((s) => s.templateID === t.id);
  function findTE(teId) {
    for (const t of D().templates) {
      const te = t.exercises.find((e) => e.id === teId);
      if (te) return { te, template: t };
    }
    return null;
  }
  function findSE(session, seId) { return session.exercises.find((e) => e.id === seId) || null; }

  /**
   * Index des occurrences terminées par exercice-de-type (templateExerciseID),
   * de la plus récente à la plus ancienne. Recalculé seulement si les données changent.
   */
  let indexCache = { version: -1, map: new Map() };
  function historyIndex() {
    if (indexCache.version === dataVersion) return indexCache.map;
    const map = new Map();
    for (const session of D().sessions) {
      if (!session.endedAt) continue;
      for (const se of session.exercises) {
        if (!se.templateExerciseID) continue;
        if (!map.has(se.templateExerciseID)) map.set(se.templateExerciseID, []);
        map.get(se.templateExerciseID).push({ se, session });
      }
    }
    for (const list of map.values()) list.sort((a, b) => ts(b.session.startedAt) - ts(a.session.startedAt));
    indexCache = { version: dataVersion, map };
    return map;
  }
  const historyOf = (teId) => historyIndex().get(teId) || [];

  // ---------------------------------------------------------------------
  // Progression (même logique que ProgressionService côté SwiftUI)
  // ---------------------------------------------------------------------
  /** Formule d'Epley : 1RM ≈ charge × (1 + reps / 30). */
  const epley = (w, r) => (!(r > 0) || !(w > 0) ? 0 : r === 1 ? w : w * (1 + r / 30));

  /** Séries retenues pour les stats : validées, hors échauffement, avec des reps. */
  const workingSets = (se) => orderedSets(se).filter((x) => x.isCompleted && !x.isWarmup && (x.reps || 0) > 0);

  function metrics(se) {
    const sets = workingSets(se);
    if (!sets.length) return null;
    const m = { maxWeight: 0, volume: 0, totalReps: 0, bestOneRM: 0, workingSets: sets.length };
    for (const x of sets) {
      const r = x.reps || 0, w = x.weight || 0;
      m.maxWeight = Math.max(m.maxWeight, w);
      m.volume += r * w;
      m.totalReps += r;
      m.bestOneRM = Math.max(m.bestOneRM, epley(w, r));
    }
    return m;
  }

  /** Occurrences antérieures de CET exercice dans CE type de séance. */
  function priorOccurrences(se, session) {
    if (!se.templateExerciseID) return [];
    const before = ts(session.startedAt);
    return historyOf(se.templateExerciseID).filter((o) => o.se.id !== se.id && ts(o.session.startedAt) < before);
  }

  /** Comparaison avec la dernière occurrence ayant des séries de travail (null la 1re fois). */
  function comparison(se, session) {
    const cur = metrics(se);
    if (!cur) return null;
    for (const o of priorOccurrences(se, session)) {
      const prev = metrics(o.se);
      if (prev) return { cur, prev };
    }
    return null;
  }

  /** Records battus dans le périmètre du type de séance (aucun à la 1re occurrence). */
  function records(se, session) {
    const none = { weight: false, oneRM: false, volume: false, any: false };
    const cur = metrics(se);
    if (!cur) return none;
    const prior = priorOccurrences(se, session).map((o) => metrics(o.se)).filter(Boolean);
    if (!prior.length) return none;
    const best = (k) => Math.max(...prior.map((p) => p[k]));
    const r = {
      weight: cur.maxWeight > best('maxWeight') + EPS,
      oneRM: cur.bestOneRM > best('bestOneRM') + EPS,
      volume: cur.volume > best('volume') + EPS,
    };
    r.any = r.weight || r.oneRM || r.volume;
    return r;
  }
  const recordLabels = (r) => [r.weight && 'Charge', r.oneRM && '1RM', r.volume && 'Volume'].filter(Boolean);

  /** Série de la séance précédente (même type) au même rang, sinon la dernière. */
  function previousSet(set, se, session) {
    const prev = priorOccurrences(se, session)[0];
    if (!prev) return null;
    const prevSets = orderedSets(prev.se).filter((x) => x.isCompleted);
    if (!prevSets.length) return null;
    const index = Math.max(0, orderedSets(se).findIndex((x) => x.id === set.id));
    return index < prevSets.length ? prevSets[index] : prevSets[prevSets.length - 1];
  }

  /** Valeurs affichées en grisé : séance précédente du même type, sinon série validée juste avant. */
  function placeholder(set, se, session) {
    const p = previousSet(set, se, session);
    if (p) return { reps: p.reps, weight: p.weight };
    const sets = orderedSets(se);
    const i = sets.findIndex((x) => x.id === set.id);
    for (let k = i - 1; k >= 0; k -= 1) {
      if (sets[k].isCompleted && sets[k].isWarmup === set.isWarmup) return { reps: sets[k].reps, weight: sets[k].weight };
    }
    return { reps: null, weight: null };
  }

  /** Surcharge progressive : haut de fourchette atteint partout à la charge max → +grand incrément. */
  function suggestion(se, session) {
    const prev = priorOccurrences(se, session).find((o) => workingSets(o.se).length > 0);
    if (!prev) return null;
    const sets = workingSets(prev.se);
    const top = Math.max(...sets.map((x) => x.weight || 0));
    if (!(top > 0)) return null;
    const reps = sets.filter((x) => Math.abs((x.weight || 0) - top) < EPS).map((x) => x.reps || 0);
    const summary = new Set(reps).size === 1 ? `${reps.length}×${reps[0]}` : reps.join('·');
    const increase = Math.min(...reps) >= se.repMax;
    return { kind: increase ? 'increase' : 'reps', last: top, target: increase ? top + toKg(S().large) : top, summary };
  }

  const setVolume = (x) => (x.reps || 0) * (x.weight || 0);
  const totalVolume = (s) => s.exercises.reduce((t, se) => t + workingSets(se).reduce((a, x) => a + setVolume(x), 0), 0);
  const workingCount = (s) => s.exercises.reduce((t, se) => t + workingSets(se).length, 0);
  const recordCount = (s) => s.exercises.filter((se) => records(se, s).any).length;
  const sessionDuration = (s) => (s.endedAt ? ts(s.endedAt) : Date.now()) - ts(s.startedAt);

  function setsSummary(se) {
    const done = orderedSets(se).filter((x) => x.isCompleted && !x.isWarmup);
    if (!done.length) return 'Aucune série validée';
    const weights = new Set(done.map((x) => x.weight || 0));
    const reps = done.map((x) => x.reps || 0);
    if (weights.size === 1) {
      const w = [...weights][0];
      const r = new Set(reps).size === 1 ? `${done.length} × ${reps[0]}` : reps.join('·');
      return `${r} @ ${fmtWU(w)}`;
    }
    return done.map((x) => `${fmtW(x.weight || 0)}×${x.reps || 0}`).join(' · ');
  }

  // ---------------------------------------------------------------------
  // Statistiques
  // ---------------------------------------------------------------------
  function weekStart(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // lundi
    return d.getTime();
  }
  function weeklyStats(weeks = 8) {
    const current = weekStart(new Date());
    const groups = new Map();
    for (const s of completedSessions()) {
      const k = weekStart(s.startedAt);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(s);
    }
    const out = [];
    for (let i = weeks - 1; i >= 0; i -= 1) {
      const d = new Date(current); d.setDate(d.getDate() - 7 * i);
      const k = weekStart(d);
      const list = groups.get(k) || [];
      out.push({ start: k, sessions: list.length, volume: list.reduce((a, s) => a + totalVolume(s), 0), current: i === 0 });
    }
    return out;
  }
  function weekStreak() {
    const weeks = new Set(completedSessions().map((s) => weekStart(s.startedAt)));
    const step = (k) => { const d = new Date(k); d.setDate(d.getDate() - 7); return weekStart(d); };
    let cursor = weekStart(new Date());
    if (!weeks.has(cursor)) cursor = step(cursor); // la semaine en cours ne casse pas la série
    let n = 0;
    while (weeks.has(cursor)) { n += 1; cursor = step(cursor); }
    return n;
  }
  /** Rotation : le type qui suit, dans l'ordre de la liste, celui de la dernière séance. */
  function suggestedTemplate() {
    const list = activeTemplates();
    if (!list.length) return null;
    const last = completedSessions()[0];
    const i = last ? list.findIndex((t) => t.id === last.templateID) : -1;
    return i === -1 ? list[0] : list[(i + 1) % list.length];
  }

  // ---------------------------------------------------------------------
  // Bibliothèque d'exercices (autocomplétion, anti-doublons)
  // ---------------------------------------------------------------------
  const BUILT_IN = [
    'Développé couché', 'Développé incliné barre', 'Développé incliné haltères', 'Développé décliné', 'Développé militaire',

  function allExerciseNames(excludeId) {

  const nextSortIndex = () => Math.max(-1, ...D().templates.map((t) => t.sortIndex)) + 1;

  /** Démarre une séance. Le nombre de séries reprend celui de la dernière fois (échauffements compris). */
  function startSession(t) {
    const s = { id: uid(), templateID: t.id, templateNameSnapshot: t.name, startedAt: nowISO(), endedAt: null, note: '', exercises: [] };
    orderedTE(t).forEach((te, i) => {
      const last = historyOf(te.id)[0];
      const prevSets = last ? orderedSets(last.se) : [];
      const warm = prevSets.filter((x) => x.isWarmup).length;
      const count = Math.max(te.plannedSets + warm, prevSets.length, 1);
      const se = {
        id: uid(), templateExerciseID: te.id, orderIndex: i, nameSnapshot: te.name, note: '',
        repMin: te.repMin, repMax: te.repMax, restSeconds: te.restSeconds, sets: [],
      };
      for (let k = 0; k < count; k += 1) {
        se.sets.push({ id: uid(), orderIndex: k, reps: null, weight: null, isWarmup: k < prevSets.length ? !!prevSets[k].isWarmup : false, isCompleted: false, completedAt: null });
      }
      s.exercises.push(se);
    });
    D().sessions.push(s);
    return s;
  }

  function completeSet(session, se, set) {
    const before = records(se, session);
    if (set.weight == null) set.weight = 0;
    set.isCompleted = true;
    set.completedAt = nowISO();
    dataVersion += 1;
    startRest(set.isWarmup ? Math.min(se.restSeconds, 60) : se.restSeconds);
    const after = records(se, session);
    const gained = { weight: after.weight && !before.weight, oneRM: after.oneRM && !before.oneRM, volume: after.volume && !before.volume };
    if (!set.isWarmup && (gained.weight || gained.oneRM || gained.volume)) {
      vibrate([30, 60, 120]);
      toast('Nouveau record !', 'gold', `${se.nameSnapshot} · ${recordLabels(gained).join(', ')}`);
    } else {
      vibrate(25);
    }
  }

  /** Termine : série saisie non cochée = faite ; séries vides supprimées. */
  function finishSession(s) {
    for (const se of s.exercises) {
      for (const x of se.sets) {
        if (!x.isCompleted && (x.reps || 0) > 0) { x.isCompleted = true; x.completedAt = nowISO(); if (x.weight == null) x.weight = 0; }
      }
      se.sets = orderedSets(se).filter((x) => x.isCompleted);
      se.sets.forEach((x, i) => { x.orderIndex = i; });
    }
    s.endedAt = nowISO();
  }
  const removeSession = (id) => { D().sessions = D().sessions.filter((s) => s.id !== id); };

  const restRunning = () => !!state.rest.endAt && state.rest.endAt > Date.now();
  function startRest(seconds) {
    if (!(seconds > 0)) { stopRest(); return; }
    state.rest = { endAt: Date.now() + seconds * 1000, duration: seconds * 1000 };
    save();
  }
  function addRest(seconds) {
    if (!state.rest.endAt) return;
    const end = state.rest.endAt + seconds * 1000;
    if (end <= Date.now()) { stopRest(); return; }
    state.rest = { endAt: end, duration: Math.max(state.rest.duration + seconds * 1000, end - Date.now()) };
    save();
  }
  function stopRest() { state.rest = { endAt: null, duration: 0 }; save(); }
  function restFinished(overdueMs) {
    stopRest();
    if (overdueMs < 60000) {
      if (S().restSound) beep();
      vibrate([200, 100, 200]);

      f.className = 'flash';

  function unlockAudio() {

  function beep() {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime;
      [[0, 880], [0.2, 880], [0.42, 1320]].forEach(([d, f]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.4, t0 + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0 + d); o.stop(t0 + d + 0.2);
      });
    } catch (_) { /* son indisponible */ }
  }

   * Retour haptique. Android : navigator.vibrate. iPhone (iOS 18+) : Safari
   * déclenche un « tic » système quand on bascule un interrupteur natif

   * pendant le geste de l'utilisateur.

  let hapticLabel = null;

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.setAttribute('switch', '');

  async function shareFile(name, mime, content) {
    const blob = new Blob([content], { type: mime });
    try {
      const file = new File([blob], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast('Fichier exporté');
    } catch (_) {
      toast("Export impossible ici : ouvre l'app installée");

  }

  function loadDemo(weeks = 6) {
    let seed = 42;
    const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const base = nextSortIndex();
    const built = DEMO.map(([name, list], i) => {
      const t = { id: uid(), name, sortIndex: base + i, createdAt: nowISO(), isArchived: false, exercises: [] };
      list.forEach(([n, sets, repMin, repMax, rest, start, step], k) => {
        t.exercises.push({ id: uid(), name: n, orderIndex: k, plannedSets: sets, repMin, repMax, restSeconds: rest, note: '', isArchived: false, _start: start, _step: step });
      });
      D().templates.push(t);
      return t;
    });
    const first = new Date(weekStart(new Date())); first.setDate(first.getDate() - 7 * weeks);
    let rotation = 0;
    const occ = new Map();
    for (let w = 0; w <= weeks; w += 1) {
      for (const day of [0, 2, 4]) {
        const start = new Date(first); start.setDate(start.getDate() + w * 7 + day); start.setHours(18, 30, 0, 0);
        if (start.getTime() + 4000 * 1000 > Date.now()) continue;
        if (rand() < 0.1) continue;
        const t = built[rotation % built.length]; rotation += 1;
        const o = occ.get(t.id) || 0; occ.set(t.id, o + 1);
        const s = { id: uid(), templateID: t.id, templateNameSnapshot: t.name, startedAt: start.toISOString(), endedAt: null, note: '', exercises: [] };
        let clock = start.getTime() + 240000;
        t.exercises.forEach((te, i) => {
          const se = { id: uid(), templateExerciseID: te.id, orderIndex: i, nameSnapshot: te.name, note: '', repMin: te.repMin, repMax: te.repMax, restSeconds: te.restSeconds, sets: [] };
          const weight = te._start + te._step * Math.floor(o / 2);
          let idx = 0;
          if (i === 0) {
            se.sets.push({ id: uid(), orderIndex: idx++, reps: 10, weight: Math.round(weight * 0.5), isWarmup: true, isCompleted: true, completedAt: new Date(clock).toISOString() });
            clock += 90000;
          }
          for (let k = 0; k < te.plannedSets; k += 1) {
            const reps = Math.max(te.repMin - 1, te.repMax - Math.floor(k / 2) - Math.floor(rand() * 2) + (o % 2) - 1);
            se.sets.push({ id: uid(), orderIndex: idx++, reps, weight, isWarmup: false, isCompleted: true, completedAt: new Date(clock).toISOString() });
            clock += (te.restSeconds + 45) * 1000;
          }
          s.exercises.push(se);
        });
        s.endedAt = new Date(clock + 120000).toISOString();
        D().sessions.push(s);
      }
    }
    for (const t of built) for (const e of t.exercises) { delete e._start; delete e._step; }
  }
