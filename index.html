        <div class="setting-row"><span>Grand incrément</span>${sel('large', [2.5, 5, 10])}</div>
      </section>
      <p class="section-label">Séance</p>
      <section class="card"><div class="setting-row"><span>Son de fin de repos</span>${sw('restSound', st.restSound)}</div></section>
      <p class="footnote">Sur iPhone, Safari ne permet pas de faire vibrer le téléphone : la fin du repos est signalée par un son et un flash. Vérifie que le mode silencieux est coupé.</p>
      <p class="section-label">Apparence</p>
      <section class="card">${segmented('setSetting', 'theme', [['system', 'Auto'], ['dark', 'Sombre'], ['light', 'Clair']], st.theme)}</section>
      <p class="section-label">Données</p>
      <section class="card flush">
        <button class="list-add" data-action="exportJSON">${icon('download')}Exporter une sauvegarde (JSON)</button>
        <button class="list-add" data-action="exportCSV">${icon('table')}Exporter les séries (CSV)</button>
        <button class="list-add" data-action="importJSON">${icon('upload')}Restaurer une sauvegarde (JSON)</button>
      </section>
      <p class="footnote">Tout est stocké uniquement sur cet iPhone. Exporte une sauvegarde régulièrement dans Fichiers ou iCloud Drive. Le CSV (une ligne par série, séparateur « ; ») s'ouvre dans Excel ou Power BI. Les sauvegardes de l'app SwiftUI sont compatibles.</p>
      <section class="card flush">
        <button class="list-add" data-action="loadDemo">${icon('wand')}Ajouter des données de démo</button>
        <button class="list-add" style="color:var(--bad)" data-action="deleteAll">${icon('trash')}Tout effacer</button>
      </section>
      <p class="section-label">À propos</p>
      <section class="card">
        <div class="setting-row"><span>Types de séances</span><span class="num muted">${nTemplates}</span></div>
        <div class="setting-row"><span>Séances enregistrées</span><span class="num muted">${nSessions}</span></div>
        <div class="setting-row"><span>Stockage protégé</span><span class="muted" id="persist-status">…</span></div>
        <div class="setting-row"><span>Mode</span><span class="muted">${isStandalone() ? 'App installée' : 'Navigateur'}</span></div>
        <div class="setting-row"><span>Version</span><span class="num muted">1.0</span></div>
      </section>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </main>`;
  }

  // ---------------------------------------------------------------------
  // Vues : séance en cours et récapitulatif
  // ---------------------------------------------------------------------
  function viewSession(s) {
    const all = orderedSE(s).flatMap((se) => orderedSets(se)).filter((x) => !x.isWarmup);
    const done = all.filter((x) => x.isCompleted).length;
    const pct = all.length ? Math.round((done / all.length) * 100) : 0;
    const cards = orderedSE(s).map((se) => exerciseCard(s, se)).join('');
    return topbar(s.templateNameSnapshot, {
      left: `<button class="bar-btn icon" data-action="sessionMenu" aria-label="Options de la séance">${icon('more')}</button>`,
      right: '<button class="bar-btn strong" data-action="finishPrompt">Terminer</button>',
    }) + `<main class="page no-tabbar">
      <section class="card session-head">
        <div class="row-between" style="align-items:flex-end">
          <div><p class="eyebrow">Durée</p><div class="clock" data-live="elapsed">${fmtElapsed(Date.now() - ts(s.startedAt))}</div></div>
          <div><p class="eyebrow" style="text-align:right">Séries</p><div class="count">${done}/${all.length}</div></div>
        </div>
        <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      </section>
      ${cards}
    </main>${restBar()}`;
  }

  function exerciseCard(s, se) {
    const sets = orderedSets(se);
    const r = records(se, s);
    const working = sets.filter((x) => !x.isWarmup).length;
    let n = 0;
    const rows = sets.map((x) => {
      const label = x.isWarmup ? 'É' : String(++n);
      const ph = placeholder(x, se, s);
      const repsShown = x.reps != null ? String(x.reps) : ph.reps != null ? String(ph.reps) : '–';
      const wShown = x.weight != null ? fmtW(x.weight) : ph.weight != null ? fmtW(ph.weight) : '–';
      const a11y = `${x.isWarmup ? 'Échauffement' : `Série ${label}`} : ${repsShown} répétitions à ${wShown} ${unitLabel()}`;
      return `<div class="set-row${x.isCompleted ? ' done' : ''}${x.isWarmup ? ' warm' : ''}">
        <span class="set-label" aria-hidden="true">${label}</span>
        <button class="set-values" data-action="editSet" data-se="${esc(se.id)}" data-set="${esc(x.id)}" aria-label="${esc(a11y)}. Modifier">
          <span class="val${x.reps == null ? ' ph' : ''}"><b>${esc(repsShown)}</b><small>reps</small></span>
          <span class="val${x.weight == null ? ' ph' : ''}"><b>${esc(wShown)}</b><small>${unitLabel()}</small></span>
        </button>
        <button class="check" data-action="toggleSet" data-se="${esc(se.id)}" data-set="${esc(x.id)}" aria-label="${x.isCompleted ? `Série ${label} validée` : `Valider la série ${label}`}">${icon(x.isCompleted ? 'checkFill' : 'circle')}</button>
      </div>`;
    }).join('');
    const sug = suggestion(se, s);
    const pending = sets.filter((x) => !x.isCompleted && !x.isWarmup);
    let hint = '';
    if (sug && pending.length) {
      const applied = pending.every((x) => x.weight != null && Math.abs(x.weight - sug.target) < 0.01);
      const text = sug.kind === 'increase'
        ? `Dernière fois ${sug.summary} à ${fmtWU(sug.last)} : tente ${fmtWU(sug.target)}.`
        : `Dernière fois ${sug.summary} à ${fmtWU(sug.last)}. Vise ${se.repMax} reps partout avant d'augmenter.`;
      hint = `<div class="hint">${icon(sug.kind === 'increase' ? 'upRight' : 'target')}<p>${esc(text)}</p>${sug.kind === 'increase' && !applied ? `<button class="chip-btn" style="background:var(--surface)" data-action="applySuggestion" data-se="${esc(se.id)}">Appliquer</button>` : ''}</div>`;
    }
    return `<article class="card">
      <div class="ex-head"><div class="txt"><h2>${esc(se.nameSnapshot)}</h2><p>${working} × ${se.repMin}–${se.repMax} reps · repos ${esc(fmtRest(se.restSeconds))}</p></div>
        ${r.any ? prBadge(r).replace('class="badge-pr"', 'class="badge-pr pop"') : ''}
        <button class="icon-btn" data-action="exerciseMenu" data-se="${esc(se.id)}" aria-label="Options de ${esc(se.nameSnapshot)}">${icon('more')}</button></div>
      ${hint}
      ${se.note ? `<div class="note">${icon('note')}<span>${esc(se.note)}</span></div>` : ''}
      <div class="sets">${rows}</div>
      <button class="add-set" data-action="addSet" data-se="${esc(se.id)}">${icon('plus')}Ajouter une série</button>
    </article>`;
  }

  function restBar() {
    if (!restRunning()) return '';
    const remaining = (state.rest.endAt - Date.now()) / 1000;
    const C = 2 * Math.PI * 19;
    const frac = state.rest.duration > 0 ? clamp(remaining * 1000 / state.rest.duration, 0, 1) : 0;
    return `<div class="rest-bar" role="timer">
      <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="track" cx="22" cy="22" r="19"/><circle class="prog" data-live="restRing" cx="22" cy="22" r="19" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(2)}"/></svg>
      <div class="time"><small>Repos</small><b data-live="restTime">${fmtClock(remaining)}</b></div>
      <button class="round-btn" data-action="restAdd" data-sec="-15" aria-label="Retirer 15 secondes">−15</button>
      <button class="round-btn" data-action="restAdd" data-sec="15" aria-label="Ajouter 15 secondes">+15</button>
      <button class="round-btn accent" data-action="restSkip" aria-label="Passer le repos">${icon('skip')}</button>
    </div>`;
  }

  function viewSummary(s) {
    const rc = recordCount(s);
    return `<main class="page no-tabbar" style="padding-top:calc(env(safe-area-inset-top, 0px) + 12px)">
      <div class="empty" style="padding:24px 0 8px">
        <div class="glyph pop" style="${rc ? 'background:var(--gold);color:var(--gold-ink)' : ''}">${icon(rc ? 'trophy' : 'check')}</div>
        <h2>Séance terminée</h2>
        <p>${esc(s.templateNameSnapshot)}${rc ? ` · ${plural(rc, 'record')} battu${rc > 1 ? 's' : ''}` : ''}</p>
      </div>
      ${sessionHeaderCard(s)}
      ${orderedSE(s).map((se) => exerciseSummaryCard(se, s, false)).join('')}
    </main>
    <div class="rest-bar" style="animation:none;padding:10px"><button class="btn" data-action="closeSummary">Fermer</button></div>`;
  }

  // ---------------------------------------------------------------------
  // Feuilles (menus, confirmations, saisies)
  // ---------------------------------------------------------------------
  /** Fonctions des feuilles ouvertes (non sérialisées). */
  let sheetHandlers = {};

  function openSheet(sheet, handlers = {}) {
    state.ui.sheet = sheet;
    sheetHandlers = handlers;
    render();
  }
  function closeSheet() {
    state.ui.sheet = null;
    sheetHandlers = {};
    render();
  }
  function openMenu(title, items) {
    // items : [{ label, icon, danger, on, run }]
    openSheet({ type: 'menu', title, items: items.map((it, i) => ({ ...it, run: undefined, i })) }, Object.fromEntries(items.map((it, i) => [`m${i}`, it.run])));
  }
  function openConfirm({ title, message, confirm, danger = true, extra = null }, onConfirm, onExtra) {
    openSheet({ type: 'confirm', title, message, confirm, danger, extra }, { confirm: onConfirm, extra: onExtra });
  }
  function openPrompt({ title, placeholder: ph, value = '', confirm = 'OK', multiline = false }, onSubmit) {
    openSheet({ type: 'prompt', title, placeholder: ph, value, confirm, multiline }, { submit: onSubmit });
  }

  function renderSheet() {
    const sh = state.ui.sheet;
    if (!sh) return '';
    let body = '';
    if (sh.type === 'menu') {
      body = `${sh.title ? `<div class="sheet-head"><h2>${esc(sh.title)}</h2></div>` : ''}
        <div class="menu">${sh.items.map((it) => `<button class="${it.danger ? 'danger' : ''}${it.on ? ' on' : ''}" data-action="sheetRun" data-key="m${it.i}">${it.icon ? icon(it.icon) : ''}<span>${esc(it.label)}</span></button>`).join('')}</div>
        <button class="btn secondary" data-action="closeSheet">Annuler</button>`;
    } else if (sh.type === 'confirm') {
      body = `<div class="sheet-head"><h2>${esc(sh.title)}</h2></div>${sh.message ? `<p class="msg">${esc(sh.message)}</p>` : ''}
        ${sh.extra ? `<button class="btn" data-action="sheetRun" data-key="extra">${esc(sh.extra)}</button>` : ''}
        <button class="btn ${sh.danger ? 'danger-fill' : ''}" data-action="sheetRun" data-key="confirm">${esc(sh.confirm)}</button>
        <button class="btn secondary" data-action="closeSheet">Annuler</button>`;
    } else if (sh.type === 'prompt') {
      const field = sh.multiline
        ? `<textarea class="input" id="prompt-input" placeholder="${esc(sh.placeholder || '')}" autofocus>${esc(sh.value)}</textarea>`
        : `<input class="input" id="prompt-input" placeholder="${esc(sh.placeholder || '')}" value="${esc(sh.value)}" autocomplete="off" enterkeyhint="done" autofocus>`;
      body = `<div class="sheet-head"><h2>${esc(sh.title)}</h2></div>${field}
        <button class="btn" data-action="promptSubmit">${esc(sh.confirm)}</button>
        <button class="btn secondary" data-action="closeSheet">Annuler</button>`;
    } else if (sh.type === 'exercise') {
      body = exerciseSheet(sh);
    } else if (sh.type === 'set') {
      body = setSheet(sh);
    }
    return `<div class="sheet-wrap"><button class="scrim" data-action="closeSheet" aria-label="Fermer"></button><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${body}</div></div>`;
  }

  // Feuille « exercice d'un type »
  const REST_OPTIONS = [30, 45, 60, 75, 90, 105, 120, 150, 180, 210, 240, 300];
  function exerciseSheet(sh) {
    const f = sh.form;
    const stepper = (key, label, lo, hi) => `<div class="stepper"><span class="lbl">${label}</span><div class="ctl">
      <button data-action="formStep" data-key="${key}" data-step="-1" data-lo="${lo}" data-hi="${hi}" aria-label="Moins">−</button>
      <output class="num">${f[key]}</output>
      <button data-action="formStep" data-key="${key}" data-step="1" data-lo="${lo}" data-hi="${hi}" aria-label="Plus">+</button></div></div>`;
    return `<div class="sheet-head"><h2>${sh.teId ? "Modifier l'exercice" : 'Nouvel exercice'}</h2><button class="icon-btn" data-action="closeSheet" aria-label="Fermer">${icon('x')}</button></div>
      <div class="field"><label for="ex-name">Exercice</label><input class="input" id="ex-name" value="${esc(f.name)}" placeholder="Ex. Développé couché" autocomplete="off" ${sh.teId ? '' : 'autofocus'}></div>
      <div id="ex-suggest">${nameSuggestHTML(f.name, sh.teId)}</div>
      <div>${stepper('plannedSets', 'Séries', 1, 12)}${stepper('repMin', 'Reps minimum', 1, 50)}${stepper('repMax', 'Reps maximum', 1, 50)}
        <div class="setting-row"><span>Repos</span><select class="input" id="ex-rest">${REST_OPTIONS.map((o) => `<option value="${o}" ${o === f.restSeconds ? 'selected' : ''}>${fmtRest(o)}</option>`).join('')}</select></div></div>
      <div class="field"><label for="ex-note">Note</label><textarea class="input" id="ex-note" placeholder="Optionnelle (réglage machine, tempo…)">${esc(f.note)}</textarea></div>
      <button class="btn" data-action="saveTE" ${cleanName(f.name) ? '' : 'disabled'}>Enregistrer</button>
      ${sh.teId ? '<button class="btn danger" data-action="deleteTE">Supprimer l\'exercice</button>' : '<button class="btn secondary" data-action="closeSheet">Annuler</button>'}`;
  }
  function nameSuggestHTML(value, excludeId) {
    const names = allExerciseNames(excludeId);
    const clean = cleanName(value);
    const sugg = nameSuggestions(value, names).filter((n) => n !== clean);
    const match = existingName(clean, names);
    return `${sugg.length ? `<div class="suggest">${sugg.map((n) => `<button class="chip-btn" data-action="pickName" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
      ${match && match !== clean ? `<p class="p small" style="margin-top:6px">Sera enregistré comme « ${esc(match)} »</p>` : ''}`;
  }

  // Feuille « série »
  function setSheet(sh) {
    const f = sh.form;
    const steps = (field, list) => `<div class="steps">${list.map((v) => `<button data-action="bump" data-field="${field}" data-step="${v}">${v < 0 ? '−' : '+'}${esc(nf1.format(Math.abs(v)))}</button>`).join('')}</div>`;
    const canValidate = (parseNum(f.reps) || 0) > 0;
    return `<div class="sheet-head"><h2>${f.isWarmup ? 'Échauffement' : 'Série'}</h2><button class="icon-btn" data-action="closeSheet" aria-label="Fermer">${icon('x')}</button></div>
      <div class="big-field"><label class="lbl" for="set-reps">Répétitions</label><input class="big-input" id="set-reps" inputmode="numeric" pattern="[0-9]*" value="${esc(f.reps)}" placeholder="0" autocomplete="off">${steps('reps', [-1, 1])}</div>
      <div class="big-field"><label class="lbl" for="set-weight">Charge (${unitLabel()})</label><input class="big-input" id="set-weight" inputmode="decimal" value="${esc(f.weight)}" placeholder="0" autocomplete="off">${steps('weight', [-S().large, -S().small, S().small, S().large])}</div>
      <div class="setting-row"><span style="display:flex;align-items:center;gap:8px">${icon('flame').replace('class=""', 'style="width:20px;height:20px;color:var(--warm)"')}Série d'échauffement</span><button class="switch warm" role="switch" aria-checked="${f.isWarmup}" data-action="toggleWarmup" aria-label="Série d'échauffement"></button></div>
      <button class="btn" id="set-validate" data-action="validateSet" ${canValidate ? '' : 'disabled'}>${f.wasCompleted ? 'Enregistrer' : 'Valider la série'}</button>
      ${f.wasCompleted ? '' : '<button class="btn ghost" data-action="keepSet">Garder sans valider</button>'}
      <button class="btn danger" data-action="removeSet">Supprimer la série</button>`;
  }

  // ---------------------------------------------------------------------
  // Navigation et rendu
  // ---------------------------------------------------------------------
  const root = document.getElementById('app');
  const scrollMemory = {};
  let lastKey = '';

  const stack = () => state.ui.stacks[state.ui.tab];
  const currentView = () => stack()[stack().length - 1] || { view: 'root' };
  function viewKey() {
    const s = activeSession();
    if (state.ui.summaryId) return `summary:${state.ui.summaryId}`;
    if (s) return `session:${s.id}`;
    const v = currentView();
    return `${state.ui.tab}:${v.view}:${v.id || ''}`;
  }
  function push(view, id) {
    stack().push({ view, id });
    state.ui.reorder = false;
    render();
  }
  function back() {
    stack().pop();
    state.ui.reorder = false;
    render();
  }

  function applyTheme() {
    const t = S().theme;
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    const meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0b0c10');
  }

  function render() {
    scrollMemory[lastKey] = window.scrollY;
    const key = viewKey();
    let html;
    const session = activeSession();
    const summary = state.ui.summaryId ? sById(state.ui.summaryId) : null;
    if (summary) {
      html = viewSummary(summary);
    } else if (session) {
      html = viewSession(session);
    } else {
      const v = currentView();
      const tab = state.ui.tab;
      if (v.view === 'templateEditor') html = viewTemplateEditor(v.id);
      else if (v.view === 'templateHistory') html = viewTemplateHistory(v.id);
      else if (v.view === 'session') html = viewSessionDetail(v.id);
      else if (v.view === 'progress') html = viewProgress(v.id);
      else if (tab === 'templates') html = viewTemplates();
      else if (tab === 'history') html = viewHistory();
      else if (tab === 'settings') html = viewSettings();
      else html = viewHome();
      const tabs = [['home', 'home', 'Accueil'], ['templates', 'dumbbell', 'Séances'], ['history', 'chart', 'Historique'], ['settings', 'gear', 'Réglages']];
      html += `<nav class="tabbar" aria-label="Navigation">${tabs.map(([id, ic, l]) => `<button class="tab" data-action="tab" data-tab="${id}" ${tab === id ? 'aria-current="page"' : ''}>${icon(ic)}<span>${l}</span></button>`).join('')}</nav>`;
    }
    html += renderSheet();
    root.innerHTML = html;
    window.scrollTo(0, scrollMemory[key] || 0);
    lastKey = key;

    const auto = root.querySelector('.sheet [autofocus]');
    if (auto) { try { auto.focus({ preventScroll: true }); } catch (_) { auto.focus(); } }
    if (key.startsWith('settings:root')) updatePersistStatus();
    syncWakeLock();
  }

  async function updatePersistStatus() {
    const el = document.getElementById('persist-status');
    if (!el) return;
    try {
      const ok = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
      el.textContent = ok ? 'Oui' : 'Non garanti';
    } catch (_) { el.textContent = 'Non garanti'; }
  }

  // Mise à jour en direct (chrono, timer) sans tout redessiner
  function tick() {
    const s = activeSession();
    if (s) {
      const el = root.querySelector('[data-live="elapsed"]');
      if (el) el.textContent = fmtElapsed(Date.now() - ts(s.startedAt));
    }
    if (state.rest.endAt) {
      const remainingMs = state.rest.endAt - Date.now();
      if (remainingMs <= 0) { restFinished(-remainingMs); return; }
      const t = root.querySelector('[data-live="restTime"]');
      if (t) t.textContent = fmtClock(remainingMs / 1000);
      const ring = root.querySelector('[data-live="restRing"]');
      if (ring) {
        const C = 2 * Math.PI * 19;
        const frac = state.rest.duration > 0 ? clamp(remainingMs / state.rest.duration, 0, 1) : 0;
        ring.setAttribute('stroke-dashoffset', (C * (1 - frac)).toFixed(2));
      }
    }
  }

  // Toast
  let toastTimer = null;
  function toast(text, tone = '') {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const el = document.createElement('div');
    el.className = `toast ${tone}`;
    el.setAttribute('role', 'status');
    el.innerHTML = `${tone === 'gold' ? icon('trophy') : icon('check')}<span>${esc(text)}</span>`;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2600);
  }

  // ---------------------------------------------------------------------
  // Gestion des actions (délégation d'événements)
  // ---------------------------------------------------------------------
  function sessionRefs(d) {
    const s = activeSession();
    if (!s) return null;
    const se = findSE(s, d.se);
    if (!se) return null;
    const set = d.set ? se.sets.find((x) => x.id === d.set) : null;
    return { s, se, set };
  }

  function openExerciseEditor(t, te) {
    openSheet({
      type: 'exercise', templateId: t.id, teId: te ? te.id : null,
      form: te
        ? { name: te.name, plannedSets: te.plannedSets, repMin: te.repMin, repMax: te.repMax, restSeconds: te.restSeconds, note: te.note || '' }
        : { name: '', plannedSets: 3, repMin: 8, repMax: 10, restSeconds: 120, note: '' },
    });
  }

  function openSetEditor(s, se, set) {
    const ph = placeholder(set, se, s);
    const reps = set.reps ?? ph.reps;
    const weight = set.weight ?? ph.weight;
    openSheet({
      type: 'set', seId: se.id, setId: set.id,
      form: { reps: reps != null ? String(reps) : '', weight: weight != null ? editNum(fromKg(weight)) : '', isWarmup: set.isWarmup, wasCompleted: set.isCompleted },
    });
  }
  function applySetForm() {
    const sh = state.ui.sheet;
    const refs = sessionRefs({ se: sh.seId, set: sh.setId });
    if (!refs || !refs.set) return null;
    const reps = parseNum(sh.form.reps), weight = parseNum(sh.form.weight);
    refs.set.reps = reps != null && reps > 0 ? Math.round(reps) : null;
    refs.set.weight = weight != null && weight >= 0 ? toKg(weight) : null;
    refs.set.isWarmup = !!sh.form.isWarmup;
    return refs;
  }

  const actions = {
    tab(d) {
      if (state.ui.tab === d.tab && stack().length) state.ui.stacks[d.tab] = []; // retaper l'onglet = revenir à sa racine
      state.ui.tab = d.tab;
      state.ui.reorder = false;
      render();
    },
    back,
    closeSheet,
    sheetRun(d) {
      const fn = sheetHandlers[d.key];
      state.ui.sheet = null; sheetHandlers = {};
      if (fn) fn(); else render();
    },
    promptSubmit() {
      const v = (document.getElementById('prompt-input') || {}).value || '';
      const fn = sheetHandlers.submit;
      state.ui.sheet = null; sheetHandlers = {};
      if (fn) fn(v); else render();
    },

    // Accueil
    loadDemo() {
      loadDemo();
      commit();
      toast('Données de démo ajoutées');
    },
    dismissInstall() { S().installHintDismissed = true; save(); render(); },
    statsMode(d) { state.ui.statsVolume = d.value === 'volume'; render(); },
    chooseTemplate() {
      const current = (activeTemplates().find((t) => t.id === state.ui.chosenTemplateId) || suggestedTemplate() || {}).id;
      openMenu('Choisir la séance', activeTemplates().map((t) => ({ label: t.name, icon: t.id === current ? 'check' : 'dumbbell', on: t.id === current, run: () => { state.ui.chosenTemplateId = t.id; render(); } })));
    },
    start(d) {
      if (activeSession()) return;
      const t = tById(d.id);
      if (!t || !orderedTE(t).length) return;
      unlockAudio();
      startSession(t);
      state.ui.chosenTemplateId = null;
      vibrate(30);
      commit();
      window.scrollTo(0, 0);
    },
    openSession(d) { push('session', d.id); },
    openProgress(d) { push('progress', d.te); },
    openTemplateHistory(d) { push('templateHistory', d.id); },

    // Types de séances
    newTemplate() {
      openPrompt({ title: 'Nouveau type de séance', placeholder: 'Nom (ex. Push A)', confirm: 'Créer' }, (name) => {
        const t = createTemplate(name);
        state.ui.tab = 'templates';
        state.ui.stacks.templates = [{ view: 'templateEditor', id: t.id }];
        commit();
      });
    },
    openTemplate(d) { push('templateEditor', d.id); },
    toggleReorder() { state.ui.reorder = !state.ui.reorder; render(); },
    moveTemplate(d) { moveTemplate(d.id, Number(d.dir)); commit(); },
    templateMenu(d) {
      const t = tById(d.id);
      if (!t) return;
      openMenu(t.name, [
        { label: 'Modifier', icon: 'note', run: () => push('templateEditor', t.id) },
        { label: 'Dupliquer', icon: 'copy', run: () => { duplicateTemplate(t); commit(); toast('Type de séance dupliqué'); } },
        { label: 'Supprimer', icon: 'trash', danger: true, run: () => actions.deleteTemplate({ id: t.id }) },
      ]);
    },
    deleteTemplate(d) {
      const t = tById(d.id);
      if (!t) return;
      const used = templateHasHistory(t);
      openConfirm({ title: `Supprimer « ${t.name} » ?`, message: used ? "Ses séances passées restent consultables dans l'Historique." : "Ce type n'a encore jamais été utilisé.", confirm: 'Supprimer' }, () => {
        deleteTemplate(t);
        if (currentView().view === 'templateEditor') stack().pop();
        commit();
      });
    },
    newTE(d) { const t = tById(d.t); if (t) openExerciseEditor(t, null); },
    editTE(d) { const t = tById(d.t); const te = t && t.exercises.find((e) => e.id === d.id); if (te) openExerciseEditor(t, te); },
    moveTE(d) { const t = tById(d.t); if (t) { moveTE(t, d.id, Number(d.dir)); commit(); } },
    formStep(d) {
      const f = state.ui.sheet.form;
      f[d.key] = clamp(f[d.key] + Number(d.step), Number(d.lo), Number(d.hi));
      if (d.key === 'repMin' && f.repMax < f.repMin) f.repMax = f.repMin;
      if (d.key === 'repMax' && f.repMin > f.repMax) f.repMin = f.repMax;
      render();
    },
    pickName(d) { state.ui.sheet.form.name = d.name; render(); },
    saveTE() {
      const sh = state.ui.sheet;
      const t = tById(sh.templateId);
      if (!t) { closeSheet(); return; }
      const f = sh.form;
      const finalName = existingName(cleanName(f.name), allExerciseNames(sh.teId)) || cleanName(f.name);
      if (!finalName) return;
      const values = { name: finalName, plannedSets: f.plannedSets, repMin: f.repMin, repMax: f.repMax, restSeconds: f.restSeconds, note: f.note.trim() };
      if (sh.teId) {
        Object.assign(t.exercises.find((e) => e.id === sh.teId) || {}, values);
      } else {
        t.exercises.push({ id: uid(), orderIndex: Math.max(-1, ...t.exercises.map((e) => e.orderIndex)) + 1, isArchived: false, ...values });
        reindexTE(t);
      }
      state.ui.sheet = null;
      vibrate(20);
      commit();
    },
    deleteTE() {
      const sh = state.ui.sheet;
      const t = tById(sh.templateId);
      const te = t && t.exercises.find((e) => e.id === sh.teId);
      if (!te) return;
      openConfirm({ title: `Supprimer « ${te.name} » ?`, message: teHasHistory(te.id) ? 'Son historique sera conservé.' : '', confirm: 'Supprimer' }, () => { deleteTE(t, te); commit(); });
    },

    // Séance en cours
    toggleSet(d) {
      const refs = sessionRefs(d);
      if (!refs || !refs.set) return;
      const { s, se, set } = refs;
      unlockAudio();
      if (set.isCompleted) {
        set.isCompleted = false; set.completedAt = null;
        vibrate(10);
        commit();
        return;
      }
      const ph = placeholder(set, se, s);
      const reps = set.reps ?? ph.reps;
      if (!(reps > 0)) { openSetEditor(s, se, set); return; } // rien à recopier : saisie
      set.reps = reps;
      if (set.weight == null) set.weight = ph.weight ?? 0;
      completeSet(s, se, set);
      commit();
    },
    editSet(d) {
      const refs = sessionRefs(d);
      if (refs && refs.set) { unlockAudio(); openSetEditor(refs.s, refs.se, refs.set); }
    },
    bump(d) {
      const f = state.ui.sheet.form;
      const step = Number(d.step);
      const next = Math.max(0, Math.round(((parseNum(f[d.field]) || 0) + step) * 100) / 100);
      f[d.field] = d.field === 'reps' ? String(Math.round(next)) : editNum(next);
      const input = document.getElementById(d.field === 'reps' ? 'set-reps' : 'set-weight');
      if (input) input.value = f[d.field];
      const btn = document.getElementById('set-validate');
      if (btn) btn.disabled = !((parseNum(f.reps) || 0) > 0);
      vibrate(8);
    },
    toggleWarmup(d, el) {
      const f = state.ui.sheet.form;
      f.isWarmup = !f.isWarmup;
      el.setAttribute('aria-checked', String(f.isWarmup));
      const h = root.querySelector('.sheet-head h2');
      if (h) h.textContent = f.isWarmup ? 'Échauffement' : 'Série';
    },
    validateSet() {
      const refs = applySetForm();
      state.ui.sheet = null;
      if (!refs) { render(); return; }
      if (!refs.set.isCompleted && (refs.set.reps || 0) > 0) completeSet(refs.s, refs.se, refs.set);
      commit();
    },
    keepSet() { applySetForm(); state.ui.sheet = null; commit(); },
    removeSet() {
      const sh = state.ui.sheet;
      const refs = sessionRefs({ se: sh.seId, set: sh.setId });
      state.ui.sheet = null;
      if (refs && refs.set) {
        refs.se.sets = orderedSets(refs.se).filter((x) => x.id !== refs.set.id);
        refs.se.sets.forEach((x, i) => { x.orderIndex = i; });
      }
      commit();
    },
    addSet(d) {
      const refs = sessionRefs(d);
      if (!refs) return;
      refs.se.sets.push({ id: uid(), orderIndex: refs.se.sets.length, reps: null, weight: null, isWarmup: false, isCompleted: false, completedAt: null });
      vibrate(10);
      commit();
    },
    applySuggestion(d) {
      const refs = sessionRefs(d);
      if (!refs) return;
      const sug = suggestion(refs.se, refs.s);
      if (!sug) return;
      for (const x of refs.se.sets) if (!x.isCompleted && !x.isWarmup) x.weight = sug.target;
      vibrate(10);
      commit();
    },
    exerciseMenu(d) {
      const refs = sessionRefs(d);
      if (!refs) return;
      const { se } = refs;
      openMenu(se.nameSnapshot, [
        { label: se.note ? 'Modifier la note' : 'Ajouter une note', icon: 'note', run: () => openPrompt({ title: 'Note de l\'exercice', placeholder: 'Ex. siège cran 4', value: se.note || '', confirm: 'Enregistrer', multiline: true }, (v) => { se.note = v.trim(); commit(); }) },
        { label: 'Ajouter une série', icon: 'plus', run: () => actions.addSet({ se: se.id }) },
      ]);
    },
    restAdd(d) { addRest(Number(d.sec)); vibrate(8); render(); },
    restSkip() { stopRest(); vibrate(8); render(); },
    sessionMenu() {
      openMenu('Séance', [{ label: 'Abandonner la séance', icon: 'x', danger: true, run: () => actions.abandonPrompt() }]);
    },
    abandonPrompt() {
      openConfirm({ title: 'Abandonner la séance ?', message: 'Elle sera supprimée, sans impact sur ton historique.', confirm: 'Abandonner' }, () => {
        const s = activeSession();
        if (s) removeSession(s.id);
        stopRest();
        commit();
      });
    },
    finishPrompt() {
      const s = activeSession();
      if (!s) return;
      const any = s.exercises.some((se) => se.sets.some((x) => x.isCompleted || (x.reps || 0) > 0));
      if (!any) {
        openConfirm({ title: 'Aucune série validée', message: 'Rien ne sera enregistré.', confirm: 'Abandonner la séance' }, () => { removeSession(s.id); stopRest(); commit(); });
        return;
      }
      openConfirm({ title: 'Terminer la séance ?', message: 'Les séries vides ne seront pas enregistrées.', confirm: 'Abandonner la séance', extra: 'Terminer et enregistrer' },
        () => { removeSession(s.id); stopRest(); commit(); },
        () => { finishSession(s); stopRest(); state.ui.summaryId = s.id; vibrate([30, 60, 30]); commit(); window.scrollTo(0, 0); });
    },
    closeSummary() { state.ui.summaryId = null; render(); },

    // Historique
    deleteSession(d) {
      openConfirm({ title: 'Supprimer cette séance ?', message: 'Elle disparaîtra de ton historique et de tes stats.', confirm: 'Supprimer' }, () => {
        removeSession(d.id);
        stack().pop();
        commit();
      });
    },
    metric(d) { state.ui.metric = d.value; render(); },

    // Réglages
    setSetting(d) { S()[d.key] = d.value; save(); applyTheme(); render(); },
    toggleSetting(d) { S()[d.key] = !S()[d.key]; save(); render(); },
    exportJSON() { exportJSON(); },
    exportCSV() { exportCSV(); },
    importJSON() { const input = document.getElementById('import-file'); if (input) input.click(); },
    deleteAll() {
      openConfirm({ title: 'Tout effacer ?', message: 'Pense à exporter une sauvegarde avant. Cette action est irréversible.', confirm: 'Effacer définitivement' }, () => {
        state.data = { version: 1, templates: [], sessions: [] };
        state.ui.stacks = { home: [], templates: [], history: [], settings: [] };
        stopRest();
        commit();
        toast('Données effacées');
      });
    },
  };

  // Clics
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || !root.contains(el) || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
  });
  document.addEventListener('pointerdown', unlockAudio, { passive: true });

  // Saisies : on met à jour l'état sans redessiner (pour garder le focus)
  document.addEventListener('input', (e) => {
    const el = e.target;
    const sh = state.ui.sheet;
    if (el.id === 'ex-name' && sh) {
      sh.form.name = el.value;
      const box = document.getElementById('ex-suggest');
      if (box) box.innerHTML = nameSuggestHTML(el.value, sh.teId);
      const btn = root.querySelector('[data-action="saveTE"]');
      if (btn) btn.disabled = !cleanName(el.value);
    } else if (el.id === 'ex-note' && sh) {
      sh.form.note = el.value;
    } else if ((el.id === 'set-reps' || el.id === 'set-weight') && sh) {
      sh.form[el.id === 'set-reps' ? 'reps' : 'weight'] = el.value;
      const btn = document.getElementById('set-validate');
      if (btn) btn.disabled = !((parseNum(sh.form.reps) || 0) > 0);
    } else if (el.dataset.input === 'templateName') {
      const t = tById(el.dataset.id);
      if (t) { t.name = el.value; save(); const h = root.querySelector('.title-inline'); if (h) h.textContent = el.value || 'Type de séance'; }
    }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'ex-rest' && state.ui.sheet) state.ui.sheet.form.restSeconds = Number(el.value);
    else if (el.dataset.setting) { S()[el.dataset.setting] = Number(el.value); save(); }
    else if (el.dataset.input === 'templateName') {
      const t = tById(el.dataset.id);
      if (t) { if (!t.name.trim()) t.name = 'Séance sans nom'; t.name = t.name.trim(); commit(); }
    } else if (el.id === 'import-file' && el.files && el.files[0]) {
      const file = el.files[0];
      el.value = '';
      file.text().then((text) => {
        let backup;
        try { backup = parseBackup(text); } catch (err) { toast(err.message || 'Fichier illisible'); return; }
        openConfirm({ title: 'Remplacer toutes les données ?', message: `La sauvegarde contient ${plural(backup.templates.length, 'type')} de séances et ${plural(backup.sessions.length, 'séance')}. Tes données actuelles seront remplacées.`, confirm: 'Remplacer' }, () => {
          state.data = backup;
          state.ui.stacks = { home: [], templates: [], history: [], settings: [] };
          commit();
          toast('Sauvegarde restaurée');
        });
      });
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'prompt-input' && e.target.tagName === 'INPUT') { e.preventDefault(); actions.promptSubmit(); }
    if (e.key === 'Escape' && state.ui.sheet) closeSheet();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
    else tick();
    syncWakeLock();
  });
  window.addEventListener('pagehide', flush);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------
  async function boot() {
    await loadPersisted();
    dataVersion += 1;
    applyTheme();
    if (state.rest.endAt && state.rest.endAt <= Date.now()) stopRest();
    render();
    setInterval(tick, 250);
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) { /* rien */ }
  }
  boot();
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
