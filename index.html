  // ---------------------------------------------------------------------
  function topbarLarge(title, subtitle, right = '', opts = {}) {
    return `<header class="nav large"><div class="nav-bar"><div class="left"></div><h2 class="nav-title">${esc(title)}</h2><div class="right">${right}</div></div></header>
      <div class="large-title"><div>${opts.eyebrow ? `<p class="eyebrow-date">${esc(opts.eyebrow)}</p>` : ''}<h1>${esc(title)}</h1>${subtitle ? `<p class="subtitle">${esc(subtitle)}</p>` : ''}</div>${opts.brand ? '<div class="brand"><img src="icon-180.png" alt=""></div>' : ''}</div>`;
  }
  function topbar(title, { left = '', right = '' } = {}) {
    return `<header class="nav"><div class="nav-bar"><div class="left">${left}</div><h1 class="nav-title">${esc(title)}</h1><div class="right">${right}</div></div></header>`;
  }
  const backBtn = () => `<button class="bar-btn" data-action="back" style="padding-left:2px">${icon('back')}<span>Retour</span></button>`;
  /** Initiales d'un type de séance : « Push A » → PA, « Legs » → LE. */
  const initials = (name) => {
    const w = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!w.length) return '?';
    return (w.length === 1 ? w[0].slice(0, 2) : w[0][0] + w[1][0]).toUpperCase();
  };
  const mono = (name, dim = false) => `<span class="mono${dim ? ' dim' : ''}" aria-hidden="true">${esc(initials(name))}</span>`;
  const dateMono = (iso) => { const d = new Date(iso); return `<span class="mono date" aria-hidden="true"><b>${d.getDate()}</b><small>${esc(d.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', ''))}</small></span>`; };
  const icoMono = (ic, extra = '') => `<span class="mono ic ${extra}" aria-hidden="true">${icon(ic)}</span>`;
  const prBadge = (r) => `<span class="badge-pr" title="${r && r.any ? esc(recordLabels(r).join(', ')) : 'Record personnel'}">${icon('trophy')}PR</span>`;
  function deltaLabel(delta, text) {
    const t = delta > 0.0001 ? 'up' : delta < -0.0001 ? 'down' : 'flat';
    const label = t === 'up' ? `En hausse de ${text}` : t === 'down' ? `En baisse de ${text}` : 'Stable';
    return `<span class="delta ${t}" aria-label="${esc(label)}">${icon(t === 'up' ? 'up' : t === 'down' ? 'down' : 'equal')}${t === 'flat' ? '' : esc(text)}</span>`;
  }
  const mag = (v, frac = 1) => `${new Intl.NumberFormat('fr-FR', { maximumFractionDigits: frac }).format(Math.abs(fromKg(v)))} ${unitLabel()}`;
  const tile = (k, v, ic = '', cls = '') => `<div class="tile ${cls}"><div class="k">${ic ? icon(ic) : ''}${esc(k)}</div><div class="v">${esc(v)}</div></div>`;
  function empty(glyph, title, text, actions = '') {
    const g = glyph === 'logo' ? '<div class="glyph logo"><img src="icon-180.png" alt=""></div>' : `<div class="glyph">${icon(glyph)}</div>`;
    return `<div class="empty">${g}<h2>${esc(title)}</h2><p>${esc(text)}</p>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;
  }
  function segmented(action, key, options, current) {
    const i = Math.max(0, options.findIndex(([v]) => String(v) === String(current)));
    return `<div class="segmented" role="group" data-seg="${esc(action + ':' + key)}" style="--n:${options.length};--i:${i}"><span class="thumb"></span>${options.map(([v, l]) => `<button data-action="${action}" data-key="${key}" data-value="${esc(v)}" aria-pressed="${String(v) === String(current)}">${esc(l)}</button>`).join('')}</div>`;
  }

  function deltaGrid(c) {
    const cell = (k, v, d, t) => `<div class="delta-cell"><div class="k">${k}</div><div class="line"><span class="v">${esc(v)}</span>${deltaLabel(d, t)}</div></div>`;
    return `<div class="delta-grid">
      ${cell('Charge max', fmtWU(c.cur.maxWeight), c.cur.maxWeight - c.prev.maxWeight, mag(c.cur.maxWeight - c.prev.maxWeight))}
      ${cell('Volume', fmtVol(c.cur.volume), c.cur.volume - c.prev.volume, mag(c.cur.volume - c.prev.volume, 0))}
      ${cell('Reps totales', String(c.cur.totalReps), c.cur.totalReps - c.prev.totalReps, String(Math.abs(c.cur.totalReps - c.prev.totalReps)))}
      ${cell('1RM estimé', fmtWU(c.cur.bestOneRM), c.cur.bestOneRM - c.prev.bestOneRM, mag(c.cur.bestOneRM - c.prev.bestOneRM))}
    </div>`;
  }

  function exerciseSummaryCard(se, session, tappable) {
    const r = records(se, session), m = metrics(se), c = comparison(se, session);
    const inner = `
      <div class="row-between"><h3 class="h3">${esc(se.nameSnapshot)}</h3><div style="display:flex;gap:6px;align-items:center">${r.any ? prBadge(r) : ''}${tappable ? icon('chevron', 'chev') : ''}</div></div>
      <p class="p small num">${m ? esc(setsSummary(se)) : 'Non réalisé'}</p>
      ${c ? deltaGrid(c) : m ? '<p class="p small">Première fois dans ce type de séance : la comparaison arrivera la prochaine fois.</p>' : ''}
      ${se.note ? `<div class="note">${icon('note')}<span>${esc(se.note)}</span></div>` : ''}`;
    return tappable && se.templateExerciseID && findTE(se.templateExerciseID)
      ? `<button class="card" style="border:0;text-align:left;width:100%" data-action="openProgress" data-te="${esc(se.templateExerciseID)}">${inner}</button>`
      : `<section class="card">${inner}</section>`;
  }

  function sessionHeaderCard(s) {
    return `<section class="card">
      <p class="p small">${esc(cap(fmtDate(s.startedAt, { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })))}</p>
      <div class="tiles two">${tile('Durée', fmtDuration(sessionDuration(s)), 'clock')}${tile('Séries', String(workingCount(s)), 'layers')}${tile('Volume', fmtVolShort(totalVolume(s)), 'dumbbell')}${tile('Records', String(recordCount(s)), 'trophy', recordCount(s) ? 'gold' : '')}</div>
    </section>`;
  }

  // Graphique en barres (stats hebdo)
  function barChart(stats, useVolume) {
    const W = 320, H = 132, padL = 4, padB = 22, padT = 16;
    const vals = stats.map((s) => (useVolume ? fromKg(s.volume) : s.sessions));
    const max = Math.max(1, ...vals);
    const slot = (W - padL) / stats.length, bw = Math.min(26, slot * 0.6);
    const y = (v) => H - padB - (v / max) * (H - padB - padT);
    const bars = stats.map((s, i) => {
      const x = padL + i * slot + (slot - bw) / 2;
      const v = vals[i], top = y(v), h = Math.max(v > 0 ? 3 : 0, H - padB - top);
      const lbl = i % 2 === (stats.length - 1) % 2 ? `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(fmtDateShort(new Date(s.start).toISOString()))}</text>` : '';
      return `<rect class="bar${v > 0 ? ' on' : ''}${s.current && v > 0 ? ' now' : ''}" x="${x.toFixed(1)}" y="${(H - padB - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="7"/>${lbl}`;
    }).join('');
    const maxLabel = useVolume ? `${nf0.format(max)} ${unitLabel()}` : plural(max, 'séance');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${useVolume ? 'Volume' : 'Séances'} par semaine sur 8 semaines">
      <line class="grid" x1="0" x2="${W}" y1="${y(max)}" y2="${y(max)}"/><text x="${W}" y="${y(max) - 4}" text-anchor="end">${esc(maxLabel)}</text>
      <line class="grid" x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}"/>${bars}</svg>`;
  }

  // Graphique de progression (ligne)
  function lineChart(points, fmt) {
    const W = 340, H = 220, padL = 46, padR = 12, padT = 14, padB = 26;
    let min = Math.min(...points.map((p) => p.value)), max = Math.max(...points.map((p) => p.value));
    if (max - min < 1e-9) { min -= 1; max += 1; }
    const span = max - min; min -= span * 0.12; max += span * 0.12;
    const t0 = points[0].t, t1 = points[points.length - 1].t;
    const x = (t) => (points.length === 1 || t1 === t0 ? (padL + W - padR) / 2 : padL + ((t - t0) / (t1 - t0)) * (W - padL - padR));
    const y = (v) => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
    const ticks = [0, 0.5, 1].map((f) => min + (max - min) * (1 - f));
    const grid = ticks.map((v) => `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${esc(fmt(v))}</text>`).join('');
    const pts = points.map((p) => `${x(p.t).toFixed(1)},${y(p.value).toFixed(1)}`);
    const area = points.length > 1 ? `<path class="area" d="M${x(t0).toFixed(1)},${H - padB} L${pts.join(' L')} L${x(t1).toFixed(1)},${H - padB} Z"/>` : '';
    const line = points.length > 1 ? `<polyline class="line" points="${pts.join(' ')}"/>` : '';
    const dots = points.map((p, k) => `<circle class="pt${p.isRecord ? ' pr' : k === points.length - 1 ? ' last' : ''}" cx="${x(p.t).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="${p.isRecord ? 6.5 : 4.5}"/>`).join('');
    const dates = `<text x="${x(t0)}" y="${H - 6}" text-anchor="${points.length === 1 ? 'middle' : 'start'}">${esc(fmtDateShort(new Date(t0).toISOString()))}</text>`
      + (points.length > 1 ? `<text x="${x(t1)}" y="${H - 6}" text-anchor="end">${esc(fmtDateShort(new Date(t1).toISOString()))}</text>` : '');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution sur ${points.length} séances">${grid}${area}${line}${dots}${dates}</svg>`;
  }

  // ---------------------------------------------------------------------
  // Vues : onglets
  // ---------------------------------------------------------------------
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function weekStrip() {
    const start = weekStart(new Date());
    const trained = new Set(completedSessions().filter((s) => weekStart(s.startedAt) === start).map((s) => { const d = new Date(s.startedAt); d.setHours(0, 0, 0, 0); return d.getTime(); }));
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return `<div class="week-strip" aria-label="Jours d'entraînement de la semaine">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((l, i) => {
      const d = new Date(start); d.setDate(d.getDate() + i); d.setHours(0, 0, 0, 0);
      const done = trained.has(d.getTime()), isToday = d.getTime() === today.getTime(), future = d > today;
      return `<div class="day${done ? ' done' : ''}${isToday ? ' today' : ''}${future ? ' future' : ''}"><small>${l}</small><span class="dot">${done ? icon('check') : d.getDate()}</span></div>`;
    }).join('')}</div>`;
  }

  function viewHome() {
    const temps = activeTemplates();
    const done = completedSessions();
    const head = (right = '') => topbarLarge("Aujourd'hui", '', right, { eyebrow: cap(fmtDateLong(nowISO())), brand: true });
    if (!temps.length && !done.length) {
      return head() + `<main class="page">${empty('logo', 'Bienvenue dans Muscu', 'Crée ton premier type de séance (Push, Pull, Legs…) ou charge des données de démo pour découvrir l\'app.',
        `<button class="btn" data-action="newTemplate">${icon('plus')}Créer un type de séance</button><button class="btn secondary" data-action="loadDemo">${icon('wand')}Charger des données de démo</button>`)}${installHint()}</main>`;
    }
    const suggested = suggestedTemplate();
    const sel = temps.find((t) => t.id === state.ui.chosenTemplateId) || suggested;
    let html = '';
    if (sel) {
      const names = orderedTE(sel).map((e) => e.name);
      const past = templateSessions(sel);
      const last = past[0];
      const avg = past.length ? past.slice(0, 5).reduce((a, s) => a + sessionDuration(s), 0) / Math.min(5, past.length) : 0;
      const chips = names.slice(0, 4).map((n) => `<span>${esc(n)}</span>`).join('') + (names.length > 4 ? `<span class="more">+${names.length - 4}</span>` : '');
      html += `<section class="card hero">
        <div class="row-between"><p class="eyebrow accent">${icon('sparkle')}${sel.id === suggested?.id ? 'Séance suggérée' : 'Séance choisie'}</p>
        ${temps.length > 1 ? `<button class="chip-btn" data-action="chooseTemplate">${icon('reorder')}Changer</button>` : ''}</div>
        <h2 class="h-hero">${esc(sel.name)}</h2>
        ${names.length ? `<div class="ex-chips">${chips}</div>` : '<p class="p">Aucun exercice. Ajoute-en depuis l\'onglet Séances.</p>'}
        <div class="meta"><span>${icon('layers')}${plural(names.length, 'exercice')}</span>${avg ? `<span>${icon('clock')}≈ ${esc(fmtDuration(avg))}</span>` : ''}<span>${icon('bolt')}${last ? esc(cap(fmtRelative(last.startedAt))) : 'Jamais réalisée'}</span></div>
        <button class="btn play" data-action="start" data-id="${esc(sel.id)}" ${names.length ? '' : 'disabled'}>${icon('play')}Démarrer la séance</button>
      </section>`;
    } else {
      html += `<section class="card"><h2 class="h3">Aucun type de séance actif</h2><p class="p">Crée un type de séance pour t'entraîner.</p><button class="btn" data-action="newTemplate">Créer un type de séance</button></section>`;
    }
    if (done[0]) {
      const stats = weeklyStats();
      const cur = stats[stats.length - 1];
      const streak = weekStreak();
      html += `<section class="card">
        <div class="row-between"><h2 class="h3">Ta semaine</h2>${streak ? `<span class="chip-btn" style="pointer-events:none">${icon('flame')}${plural(streak, 'semaine')}</span>` : ''}</div>
        ${weekStrip()}
        <div class="tiles">${tile('Séances', String(cur.sessions), 'dumbbell')}${tile('Volume', fmtVolShort(cur.volume), 'layers')}${tile('Régularité', `${streak} sem.`, 'flame')}</div>
      </section>`;
      const s = done[0];
      const rc = recordCount(s);
      html += `<button class="card" data-action="openSession" data-id="${esc(s.id)}">
        <div class="row-between"><p class="eyebrow">Dernière séance</p>${icon('chevron', 'chev')}</div>
        <div style="display:flex;align-items:center;gap:12px">${mono(s.templateNameSnapshot)}<div style="flex:1;min-width:0"><h2 class="h2">${esc(s.templateNameSnapshot)}</h2><p class="p small">${esc(cap(fmtRelative(s.startedAt)))} · ${esc(fmtDuration(sessionDuration(s)))}</p></div>${rc ? prBadge() : ''}</div>
        <div class="tiles">${tile('Séries', String(workingCount(s)), 'layers')}${tile('Volume', fmtVolShort(totalVolume(s)), 'dumbbell')}${tile('Records', String(rc), 'trophy', rc ? 'gold' : '')}</div>
      </button>`;
      html += `<section class="card">
        <div class="row-between"><h2 class="h3">8 semaines</h2><div style="width:176px">${segmented('statsMode', 'mode', [['sessions', 'Séances'], ['volume', 'Volume']], state.ui.statsVolume ? 'volume' : 'sessions')}</div></div>
        ${barChart(stats, state.ui.statsVolume)}

    html += installHint();
    return head() + `<main class="page">${html}</main>`;

  function installHint() {
    // Pas de conseil d'installation dans l'aperçu en ligne (pas de manifeste) ni une fois installée.
    if (isStandalone() || S().installHintDismissed || !document.querySelector('link[rel="manifest"]')) return '';
    return `<section class="card install">
      <div class="row-between"><h2 class="h3" style="display:flex;align-items:center;gap:10px">${icoMono('phone')}Installer l'app</h2><button class="icon-btn" data-action="dismissInstall" aria-label="Masquer">${icon('x')}</button></div>

    </section>`;
  }

  function viewTemplates() {
    const temps = activeTemplates();
    const right = (temps.length > 1 ? `<button class="bar-btn ${state.ui.reorder ? 'strong' : ''}" data-action="toggleReorder">${state.ui.reorder ? 'OK' : 'Ordre'}</button>` : '')
      + `<button class="bar-btn icon glassy" data-action="newTemplate" aria-label="Nouveau type de séance">${icon('plus')}</button>`;
    if (!temps.length) {
      return topbarLarge('Séances', 'Tes programmes', right) + `<main class="page">${empty('dumbbell', 'Aucun type de séance', 'Un type de séance regroupe tes exercices (Push A, Pull, Legs…). Ta progression est suivie séparément pour chacun.',
        '<button class="btn" data-action="newTemplate">Créer un type de séance</button>')}</main>`;
    }
    const rows = temps.map((t, i) => {
      const n = orderedTE(t).length, last = templateSessions(t)[0];
      const sub = [plural(n, 'exercice'), last ? fmtRelative(last.startedAt) : null].filter(Boolean).join(' · ');
      const trailing = state.ui.reorder
        ? `<button class="icon-btn" data-action="moveTemplate" data-id="${esc(t.id)}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Monter">${icon('up')}</button><button class="icon-btn" data-action="moveTemplate" data-id="${esc(t.id)}" data-dir="1" ${i === temps.length - 1 ? 'disabled' : ''} aria-label="Descendre">${icon('down')}</button>`
        : `<button class="icon-btn" data-action="templateMenu" data-id="${esc(t.id)}" aria-label="Options de ${esc(t.name)}">${icon('more')}</button>`;
      return `<div class="list-row"><button class="list-main" data-action="openTemplate" data-id="${esc(t.id)}">${mono(t.name)}<div class="txt"><div class="t">${esc(t.name)}</div><div class="s">${esc(sub)}</div></div>${state.ui.reorder ? '' : icon('chevron', 'chev')}</button>${trailing}</div>`;
    }).join('');
    return topbarLarge('Séances', `${plural(temps.length, 'programme')} · ${plural(temps.reduce((a, t) => a + orderedTE(t).length, 0), 'exercice')}`, right) + `<main class="page"><section class="card flush">${rows}<button class="list-add" data-action="newTemplate">${icoMono('plus')}Nouveau type de séance</button></section>
      <p class="footnote">Supprimer un type déjà utilisé l'archive : ses séances restent dans l'Historique.</p></main>`;
  }

  function viewTemplateEditor(id) {

      return `<div class="list-row"><button class="list-main" data-action="editTE" data-t="${esc(t.id)}" data-id="${esc(e.id)}"><span class="mono dim">${i + 1}</span><div class="txt"><div class="t">${esc(e.name)}</div><div class="s">${e.plannedSets} × ${e.repMin}–${e.repMax} · repos ${esc(fmtRest(e.restSeconds))}${e.note ? ` · ${esc(e.note)}` : ''}</div></div>${state.ui.reorder ? '' : icon('chevron', 'chev')}</button>${trailing}</div>`;
    }).join('');
    const right = list.length > 1 ? `<button class="bar-btn ${state.ui.reorder ? 'strong' : ''}" data-action="toggleReorder">${state.ui.reorder ? 'OK' : 'Ordre'}</button>` : '';
    return topbar(t.name || 'Type de séance', { left: backBtn(), right }) + `<main class="page">
      <div class="field"><label for="tpl-name">Nom</label><input class="input" id="tpl-name" data-input="templateName" data-id="${esc(t.id)}" value="${esc(t.name)}" autocomplete="off" enterkeyhint="done"></div>
      <p class="section-label">Exercices</p>
      <section class="card flush">${rows}<button class="list-add" data-action="newTE" data-t="${esc(t.id)}">${icoMono('plus')}Ajouter un exercice</button></section>
      <p class="footnote">Supprimer un exercice déjà réalisé conserve son historique.</p>
      <button class="btn danger" data-action="deleteTemplate" data-id="${esc(t.id)}">Supprimer ce type de séance</button>
    </main>`;
  }

  function viewHistory() {
    const done = completedSessions();
    if (!done.length) return topbarLarge('Historique') + `<main class="page">${empty('trend', "Pas encore d'historique", 'Tes séances terminées apparaîtront ici, classées par type de séance.')}</main>`;
    const temps = D().templates.filter((t) => templateSessions(t).length)
      .sort((a, b) => (a.isArchived - b.isArchived) || (a.sortIndex - b.sortIndex));
    const tRows = temps.map((t) => {
      const list = templateSessions(t);
      return `<div class="list-row"><button class="list-main" data-action="openTemplateHistory" data-id="${esc(t.id)}">${mono(t.name, t.isArchived)}<div class="txt"><div class="t">${esc(t.name)} ${t.isArchived ? '<span class="tag">Archivé</span>' : ''}</div><div class="s">${plural(list.length, 'séance')} · ${esc(fmtRelative(list[0].startedAt))}</div></div>${icon('chevron', 'chev')}</button></div>`;
    }).join('');
    const sessionRow = (s) => `<div class="list-row"><button class="list-main" data-action="openSession" data-id="${esc(s.id)}">${dateMono(s.startedAt)}<div class="txt"><div class="t">${esc(s.templateNameSnapshot)}</div><div class="s">${esc(cap(fmtRelative(s.startedAt)))} · ${esc(fmtDuration(sessionDuration(s)))} · ${esc(fmtVol(totalVolume(s)))}</div></div>${recordCount(s) ? prBadge() : ''}${icon('chevron', 'chev')}</button></div>`;
    const orphans = done.filter((s) => !s.templateID || !tById(s.templateID));
    const totalVol = done.reduce((a, s) => a + totalVolume(s), 0);
    return topbarLarge('Historique', `${plural(done.length, 'séance')} au total`) + `<main class="page">
      <div class="tiles">${tile('Séances', String(done.length), 'dumbbell')}${tile('Volume', fmtVolShort(totalVol), 'layers')}${tile('Records', String(done.reduce((a, s) => a + recordCount(s), 0)), 'trophy', 'gold')}</div>
      <p class="section-label">Par type de séance</p><section class="card flush">${tRows}</section>
      <p class="section-label">Dernières séances</p><section class="card flush">${done.slice(0, 10).map(sessionRow).join('')}</section>
      ${orphans.length ? `<p class="section-label">Sans type de séance</p><section class="card flush">${orphans.map(sessionRow).join('')}</section>` : ''}
    </main>`;
  }

  function viewTemplateHistory(id) {
    const t = tById(id);
    if (!t) return topbar('Introuvable', { left: backBtn() }) + '<main class="page"></main>';
    const sessions = templateSessions(t);
    const avg = sessions.length ? sessions.reduce((a, s) => a + sessionDuration(s), 0) / sessions.length : 0;
    const exercises = t.exercises.filter((e) => historyOf(e.id).length).sort((a, b) => (a.isArchived - b.isArchived) || (a.orderIndex - b.orderIndex));
    const exRows = exercises.map((e) => {
      const last = historyOf(e.id)[0];
      const m = last && metrics(last.se), c = last && comparison(last.se, last.session);
      return `<div class="list-row"><button class="list-main" data-action="openProgress" data-te="${esc(e.id)}"><div class="txt"><div class="t">${esc(e.name)} ${e.isArchived ? '<span class="tag">Archivé</span>' : ''}</div>${m ? `<div class="s">Max ${esc(fmtWU(m.maxWeight))} · 1RM est. ${esc(fmtWU(m.bestOneRM))}</div>` : ''}</div>${c ? deltaLabel(c.cur.bestOneRM - c.prev.bestOneRM, mag(c.cur.bestOneRM - c.prev.bestOneRM)) : ''}${icon('chevron', 'chev')}</button></div>`;
    }).join('');
    const sRows = sessions.map((s) => `<div class="list-row"><button class="list-main" data-action="openSession" data-id="${esc(s.id)}">${dateMono(s.startedAt)}<div class="txt"><div class="t">${esc(cap(fmtDate(s.startedAt, { weekday: 'long', day: 'numeric', month: 'long' })))}</div><div class="s">${esc(fmtDuration(sessionDuration(s)))} · ${esc(fmtVol(totalVolume(s)))}</div></div>${recordCount(s) ? prBadge() : ''}${icon('chevron', 'chev')}</button></div>`).join('');
    return topbar(t.name, { left: backBtn() }) + `<main class="page">
      <div class="tiles two">${tile('Séances', String(sessions.length), 'dumbbell')}${tile('Durée moyenne', fmtDuration(avg), 'clock')}</div>
      <p class="section-label">Exercices</p><section class="card flush plain">${exRows}</section>
      <p class="footnote">Progression calculée uniquement sur « ${esc(t.name)} ».</p>
      <p class="section-label">Séances</p><section class="card flush">${sRows}</section>
    </main>`;
  }

  function viewSessionDetail(id) {
    const s = sById(id);
    if (!s) return topbar('Introuvable', { left: backBtn() }) + `<main class="page">${empty('x', 'Séance introuvable', 'Cette séance a été supprimée.')}</main>`;
    return topbar(s.templateNameSnapshot, { left: backBtn() }) + `<main class="page">
      ${sessionHeaderCard(s)}
      ${orderedSE(s).map((se) => exerciseSummaryCard(se, s, true)).join('')}
      <button class="btn danger" data-action="deleteSession" data-id="${esc(s.id)}">Supprimer cette séance</button>
    </main>`;
  }

  function viewProgress(teId) {
    const found = findTE(teId);
    if (!found) return topbar('Introuvable', { left: backBtn() }) + '<main class="page"></main>';
    const { te, template } = found;
    const metric = state.ui.metric;
    const valueOf = (m) => fromKg(metric === 'volume' ? m.volume : metric === 'oneRM' ? m.bestOneRM : m.maxWeight);
    const frac = metric === 'volume' ? 0 : 1;
    const f = (v) => `${new Intl.NumberFormat('fr-FR', { maximumFractionDigits: frac }).format(v)}`;
    const points = [];
    let best = -Infinity, prev = null;
    for (const o of [...historyOf(te.id)].reverse()) {
      const m = metrics(o.se);
      if (!m) continue;
      const v = valueOf(m);
      points.push({ t: ts(o.session.startedAt), value: v, isRecord: points.length > 0 && v > best + EPS, summary: setsSummary(o.se), delta: prev == null ? null : v - prev, sessionId: o.session.id });
      best = Math.max(best, v); prev = v;
    }
    const u = unitLabel();
    const chart = points.length
      ? `${lineChart(points, f)}${points.length === 1 ? '<p class="p small">Encore une séance pour voir une tendance.</p>' : ''}${points.some((p) => p.isRecord) ? `<p class="p small"><span style="color:var(--gold)">●</span> Point doré : record battu</p>` : ''}`
      : '<p class="p">Aucune série de travail enregistrée.</p>';
    const stats = points.length ? `<div class="tiles">${tile('Dernier', `${f(points[points.length - 1].value)} ${u}`, 'bolt')}${tile('Meilleur', `${f(Math.max(...points.map((p) => p.value)))} ${u}`, 'trophy', 'gold')}${tile('Évolution', (() => { const d = points[points.length - 1].value - points[0].value; return `${d > 0.0001 ? '+' : d < -0.0001 ? '−' : ''}${f(Math.abs(d))} ${u}`; })(), 'trend')}</div>` : '';
    const rows = [...points].reverse().map((p) => `<div class="list-row"><button class="list-main" data-action="openSession" data-id="${esc(p.sessionId)}"><div class="txt"><div class="t" style="font-size:15px">${esc(fmtDate(new Date(p.t).toISOString(), { weekday: 'short', day: 'numeric', month: 'short' }))}</div><div class="s">${esc(p.summary)}</div></div>
      <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px">${p.isRecord ? `<span style="color:var(--gold)">${icon('trophy').replace('class=""', 'style="width:14px;height:14px"')}</span>` : ''}<span class="num" style="font-weight:700">${esc(f(p.value))} ${u}</span>${p.delta == null ? '' : deltaLabel(p.delta, `${f(Math.abs(p.delta))} ${u}`)}</div></button></div>`).join('');
    return topbar(te.name, { left: backBtn() }) + `<main class="page">
      ${segmented('metric', 'metric', [['maxWeight', 'Charge max'], ['volume', 'Volume'], ['oneRM', '1RM estimé']], metric)}
      <section class="card"><p class="p small">Dans « ${esc(template.name)} » uniquement ${te.isArchived ? '<span class="tag">Archivé</span>' : ''}</p>${chart}</section>
      ${stats}
      ${rows ? `<section class="card flush plain">${rows}</section>` : ''}
    </main>`;
  }

      <section class="card">

        <div class="setting-row"><span>${icoMono('phone')}Mode</span><span class="muted">${isStandalone() ? 'App installée' : 'Navigateur'}</span></div>
        <div class="setting-row"><span>${icoMono('info')}Version</span><span class="num muted">2.0</span></div>

  // ---------------------------------------------------------------------
  // Vues : séance en cours et récapitulatif
  // ---------------------------------------------------------------------
  function viewSession(s) {
    const all = orderedSE(s).flatMap((se) => orderedSets(se)).filter((x) => !x.isWarmup);
    const done = all.filter((x) => x.isCompleted).length;
    const frac = all.length ? done / all.length : 0;
    const activeSet = orderedSE(s).flatMap((se) => orderedSets(se)).find((x) => !x.isCompleted);
    const cards = orderedSE(s).map((se, i) => exerciseCard(s, se, i, activeSet ? activeSet.id : null)).join('');
    const C = 2 * Math.PI * 38;
    return topbar(s.templateNameSnapshot, {
      left: `<button class="bar-btn icon glassy" data-action="sessionMenu" aria-label="Options de la séance">${icon('more')}</button>`,
      right: '<button class="bar-btn pill" data-action="finishPrompt">Terminer</button>',
    }) + `<main class="page no-tabbar">
      <section class="card session-head">
        <div class="ring-wrap" role="progressbar" aria-valuenow="${Math.round(frac * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="Séries validées">
          <svg viewBox="0 0 88 88" aria-hidden="true"><circle class="track" cx="44" cy="44" r="38"/><circle class="prog" cx="44" cy="44" r="38" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(2)}"/></svg>
          <div class="lbl"><div><b>${done}/${all.length}</b><small>SÉRIES</small></div></div>
        </div>
        <div style="min-width:0">
          <p class="eyebrow accent live"><span class="live-dot"></span>En cours</p>
          <div class="clock" data-live="elapsed">${fmtElapsed(Date.now() - ts(s.startedAt))}</div>
          <p class="p small" style="margin-top:4px">${plural(s.exercises.length, 'exercice')} · ${esc(fmtVolShort(totalVolume(s)))}</p>
        </div>
      </section>
      ${cards}
    </main>${restBar()}`;
  }

  function exerciseCard(s, se, index, activeSetId) {
    const sets = orderedSets(se);
    const r = records(se, s);
    const working = sets.filter((x) => !x.isWarmup).length;
    const complete = sets.length > 0 && sets.every((x) => x.isCompleted);
    let n = 0;
    const rows = sets.map((x) => {
      const label = x.isWarmup ? 'É' : String(++n);
      const ph = placeholder(x, se, s);
      const repsShown = x.reps != null ? String(x.reps) : ph.reps != null ? String(ph.reps) : '–';
      const wShown = x.weight != null ? fmtW(x.weight) : ph.weight != null ? fmtW(ph.weight) : '–';
      const a11y = `${x.isWarmup ? 'Échauffement' : `Série ${label}`} : ${repsShown} répétitions à ${wShown} ${unitLabel()}`;
      const cls = `${x.isCompleted ? ' done' : ''}${x.isWarmup ? ' warm' : ''}${x.id === activeSetId ? ' active' : ''}${x.id === state.ui.justSet ? ' just' : ''}`;
      return `<div class="set-row${cls}">
        <span class="set-label" aria-hidden="true">${label}</span>
        <button class="set-values" data-action="editSet" data-se="${esc(se.id)}" data-set="${esc(x.id)}" aria-label="${esc(a11y)}. Modifier">
          <span class="val${x.reps == null ? ' ph' : ''}"><b>${esc(repsShown)}</b><small>reps</small></span>
          <span class="val${x.weight == null ? ' ph' : ''}"><b>${esc(wShown)}</b><small>${unitLabel()}</small></span>
        </button>
        <button class="check" data-action="toggleSet" data-se="${esc(se.id)}" data-set="${esc(x.id)}" aria-label="${x.isCompleted ? `Série ${label} validée` : `Valider la série ${label}`}"><span class="c">${icon('check')}</span></button>
      </div>`;
    }).join('');
    const sug = suggestion(se, s);
    const pending = sets.filter((x) => !x.isCompleted && !x.isWarmup);
    let hint = '';
    if (sug && pending.length) {
      const applied = pending.every((x) => x.weight != null && Math.abs(x.weight - sug.target) < 0.01);
      const text = sug.kind === 'increase'
        ? `Dernière fois ${sug.summary} à ${fmtWU(sug.last)} : tente ${fmtWU(sug.target)}.`
        : `Dernière fois ${sug.summary} à ${fmtWU(sug.last)}. Vise ${se.repMax} reps partout avant d'augmenter.`;
      hint = `<div class="hint"><span class="hi">${icon(sug.kind === 'increase' ? 'upRight' : 'target')}</span><p>${esc(text)}</p>${sug.kind === 'increase' && !applied ? `<button class="chip-btn" data-action="applySuggestion" data-se="${esc(se.id)}">Appliquer</button>` : ''}</div>`;
    }
    return `<article class="card ex-card${complete ? ' complete' : ''}">
      <div class="ex-head"><span class="idx" aria-hidden="true">${complete ? icon('check') : index + 1}</span><div class="txt"><h2>${esc(se.nameSnapshot)}</h2><p>${working} × ${se.repMin}–${se.repMax} reps · repos ${esc(fmtRest(se.restSeconds))}</p></div>
        ${r.any ? prBadge(r).replace('class="badge-pr"', 'class="badge-pr pop"') : ''}
        <button class="icon-btn" data-action="exerciseMenu" data-se="${esc(se.id)}" aria-label="Options de ${esc(se.nameSnapshot)}">${icon('more')}</button></div>
      ${hint}
      ${se.note ? `<div class="note">${icon('note')}<span>${esc(se.note)}</span></div>` : ''}
      ${sets.length ? '<div class="sets-head" aria-hidden="true"><span></span><span>Reps</span><span>Charge</span><span></span></div>' : ''}
      <div class="sets">${rows}</div>
      <button class="add-set" data-action="addSet" data-se="${esc(se.id)}">${icon('plus')}Ajouter une série</button>
    </article>`;
  }

  function restBar() {
    if (!restRunning()) return '';
    const remaining = (state.rest.endAt - Date.now()) / 1000;
    const C = 2 * Math.PI * 20;
    const frac = state.rest.duration > 0 ? clamp(remaining * 1000 / state.rest.duration, 0, 1) : 0;
    return `<div class="rest-bar" role="timer">
      <svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="track" cx="24" cy="24" r="20"/><circle class="prog" data-live="restRing" data-c="${C.toFixed(3)}" cx="24" cy="24" r="20" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(2)}"/></svg>
      <div class="time"><small>Repos</small><b data-live="restTime">${fmtClock(remaining)}</b></div>
      <button class="round-btn" data-action="restAdd" data-sec="-15" aria-label="Retirer 15 secondes">−15</button>
      <button class="round-btn" data-action="restAdd" data-sec="15" aria-label="Ajouter 15 secondes">+15</button>
      <button class="round-btn accent" data-action="restSkip" aria-label="Passer le repos">${icon('skip')}</button>
    </div>`;
  }

  function viewSummary(s) {
    const rc = recordCount(s);
    return `<main class="page no-tabbar" style="padding-top:calc(env(safe-area-inset-top, 0px) + 12px)">
      <div class="empty" style="padding:24px 0 8px">
        <div class="glyph pop" style="${rc ? 'background:var(--grad-gold);color:var(--gold-ink)' : ''}">${icon(rc ? 'trophy' : 'check')}</div>
        <h2>${rc ? 'Bravo, nouveaux records !' : 'Séance terminée'}</h2>
        <p>${esc(s.templateNameSnapshot)}${rc ? ` · ${plural(rc, 'record')} battu${rc > 1 ? 's' : ''}` : ''}</p>
      </div>
      ${sessionHeaderCard(s)}
      ${orderedSE(s).map((se) => exerciseSummaryCard(se, s, false)).join('')}
    </main>
    <div class="rest-bar summary-bar"><button class="btn" data-action="closeSummary">${icon('check')}Terminé</button></div>`;
  }

  // ---------------------------------------------------------------------
  // Feuilles (menus, confirmations, saisies)
  // ---------------------------------------------------------------------
  /** Fonctions des feuilles ouvertes (non sérialisées). */
  let sheetHandlers = {};

  function openSheet(sheet, handlers = {}) {
    state.ui.sheet = sheet;
    sheetHandlers = handlers;
    render();
  }
  function closeSheet() {
    state.ui.sheet = null;
    sheetHandlers = {};
    render();
  }
  function openMenu(title, items) {
    // items : [{ label, icon, danger, on, run }]
    openSheet({ type: 'menu', title, items: items.map((it, i) => ({ ...it, run: undefined, i })) }, Object.fromEntries(items.map((it, i) => [`m${i}`, it.run])));
  }
  function openConfirm({ title, message, confirm, danger = true, extra = null }, onConfirm, onExtra) {
    openSheet({ type: 'confirm', title, message, confirm, danger, extra }, { confirm: onConfirm, extra: onExtra });
  }
  function openPrompt({ title, placeholder: ph, value = '', confirm = 'OK', multiline = false }, onSubmit) {
    openSheet({ type: 'prompt', title, placeholder: ph, value, confirm, multiline }, { submit: onSubmit });
  }

  function renderSheet() {
    const sh = state.ui.sheet;
    if (!sh) return '';
    let body = '';
    if (sh.type === 'menu') {
      body = `${sh.title ? `<div class="sheet-head"><h2>${esc(sh.title)}</h2></div>` : ''}
        <div class="menu">${sh.items.map((it) => `<button class="${it.danger ? 'danger' : ''}${it.on ? ' on' : ''}" data-action="sheetRun" data-key="m${it.i}">${it.icon ? icon(it.icon) : ''}<span>${esc(it.label)}</span></button>`).join('')}</div>
        <button class="btn secondary" data-action="closeSheet">Annuler</button>`;
    } else if (sh.type === 'confirm') {
      body = `<div class="sheet-head"><h2>${esc(sh.title)}</h2></div>${sh.message ? `<p class="msg">${esc(sh.message)}</p>` : ''}
        ${sh.extra ? `<button class="btn" data-action="sheetRun" data-key="extra">${esc(sh.extra)}</button>` : ''}
        <button class="btn ${sh.danger ? 'danger-fill' : ''}" data-action="sheetRun" data-key="confirm">${esc(sh.confirm)}</button>
        <button class="btn secondary" data-action="closeSheet">Annuler</button>`;
    } else if (sh.type === 'prompt') {
      const field = sh.multiline
        ? `<textarea class="input" id="prompt-input" placeholder="${esc(sh.placeholder || '')}" autofocus>${esc(sh.value)}</textarea>`
        : `<input class="input" id="prompt-input" placeholder="${esc(sh.placeholder || '')}" value="${esc(sh.value)}" autocomplete="off" enterkeyhint="done" autofocus>`;
      body = `<div class="sheet-head"><h2>${esc(sh.title)}</h2></div>${field}
        <button class="btn" data-action="promptSubmit">${esc(sh.confirm)}</button>
        <button class="btn secondary" data-action="closeSheet">Annuler</button>`;
    } else if (sh.type === 'exercise') {
      body = exerciseSheet(sh);
    } else if (sh.type === 'set') {
      body = setSheet(sh);
    }
    return `<div class="sheet-wrap"><button class="scrim" data-action="closeSheet" aria-label="Fermer"></button><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${body}</div></div>`;
  }

  // Feuille « exercice d'un type »
  const REST_OPTIONS = [30, 45, 60, 75, 90, 105, 120, 150, 180, 210, 240, 300];
  function exerciseSheet(sh) {
    const f = sh.form;
    const stepper = (key, label, lo, hi) => `<div class="stepper"><span class="lbl">${label}</span><div class="ctl">
      <button data-action="formStep" data-key="${key}" data-step="-1" data-lo="${lo}" data-hi="${hi}" aria-label="Moins">−</button>
      <output class="num">${f[key]}</output>
      <button data-action="formStep" data-key="${key}" data-step="1" data-lo="${lo}" data-hi="${hi}" aria-label="Plus">+</button></div></div>`;
    return `<div class="sheet-head"><h2>${sh.teId ? "Modifier l'exercice" : 'Nouvel exercice'}</h2><button class="icon-btn" data-action="closeSheet" aria-label="Fermer">${icon('x')}</button></div>
      <div class="field"><label for="ex-name">Exercice</label><input class="input" id="ex-name" value="${esc(f.name)}" placeholder="Ex. Développé couché" autocomplete="off" ${sh.teId ? '' : 'autofocus'}></div>
      <div id="ex-suggest">${nameSuggestHTML(f.name, sh.teId)}</div>
      <div>${stepper('plannedSets', 'Séries', 1, 12)}${stepper('repMin', 'Reps minimum', 1, 50)}${stepper('repMax', 'Reps maximum', 1, 50)}
        <div class="setting-row"><span>Repos</span><select class="input" id="ex-rest">${REST_OPTIONS.map((o) => `<option value="${o}" ${o === f.restSeconds ? 'selected' : ''}>${fmtRest(o)}</option>`).join('')}</select></div></div>
      <div class="field"><label for="ex-note">Note</label><textarea class="input" id="ex-note" placeholder="Optionnelle (réglage machine, tempo…)">${esc(f.note)}</textarea></div>
      <button class="btn" data-action="saveTE" ${cleanName(f.name) ? '' : 'disabled'}>Enregistrer</button>
      ${sh.teId ? '<button class="btn danger" data-action="deleteTE">Supprimer l\'exercice</button>' : '<button class="btn secondary" data-action="closeSheet">Annuler</button>'}`;
  }
  function nameSuggestHTML(value, excludeId) {
    const names = allExerciseNames(excludeId);
    const clean = cleanName(value);
    const sugg = nameSuggestions(value, names).filter((n) => n !== clean);
    const match = existingName(clean, names);
    return `${sugg.length ? `<div class="suggest">${sugg.map((n) => `<button class="chip-btn" data-action="pickName" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
      ${match && match !== clean ? `<p class="p small" style="margin-top:6px">Sera enregistré comme « ${esc(match)} »</p>` : ''}`;
  }

  // Feuille « série »
  function setSheet(sh) {
    const f = sh.form;
    const steps = (field, list) => `<div class="steps">${list.map((v) => `<button data-action="bump" data-field="${field}" data-step="${v}">${v < 0 ? '−' : '+'}${esc(nf1.format(Math.abs(v)))}</button>`).join('')}</div>`;
    const canValidate = (parseNum(f.reps) || 0) > 0;
    return `<div class="sheet-head"><h2>${f.isWarmup ? 'Échauffement' : 'Série'}</h2><button class="icon-btn" data-action="closeSheet" aria-label="Fermer">${icon('x')}</button></div>
      <div class="big-field"><label class="lbl" for="set-reps">Répétitions</label><input class="big-input" id="set-reps" inputmode="numeric" pattern="[0-9]*" value="${esc(f.reps)}" placeholder="0" autocomplete="off">${steps('reps', [-1, 1])}</div>
      <div class="big-field"><label class="lbl" for="set-weight">Charge (${unitLabel()})</label><input class="big-input" id="set-weight" inputmode="decimal" value="${esc(f.weight)}" placeholder="0" autocomplete="off">${steps('weight', [-S().large, -S().small, S().small, S().large])}</div>
      <div class="setting-row"><span style="display:flex;align-items:center;gap:8px">${icon('flame').replace('class=""', 'style="width:20px;height:20px;color:var(--warm)"')}Série d'échauffement</span><button class="switch warm" role="switch" aria-checked="${f.isWarmup}" data-action="toggleWarmup" aria-label="Série d'échauffement"></button></div>
      <button class="btn" id="set-validate" data-action="validateSet" ${canValidate ? '' : 'disabled'}>${f.wasCompleted ? 'Enregistrer' : 'Valider la série'}</button>
      ${f.wasCompleted ? '' : '<button class="btn ghost" data-action="keepSet">Garder sans valider</button>'}
      <button class="btn danger" data-action="removeSet">Supprimer la série</button>`;
  }

  // ---------------------------------------------------------------------
  // Navigation et rendu
  // ---------------------------------------------------------------------
  const root = document.getElementById('app');
  const scrollMemory = {};
  let lastKey = '';

  const stack = () => state.ui.stacks[state.ui.tab];
  const currentView = () => stack()[stack().length - 1] || { view: 'root' };
  function viewKey() {
    const s = activeSession();
    if (state.ui.summaryId) return `summary:${state.ui.summaryId}`;
    if (s) return `session:${s.id}`;
    const v = currentView();
    return `${state.ui.tab}:${v.view}:${v.id || ''}`;
  }
  let navAnim = '';
  function push(view, id) {
    navAnim = 'push';
    stack().push({ view, id });
    state.ui.reorder = false;
    render();
  }
  function back() {
    navAnim = 'pop';
    stack().pop();
    state.ui.reorder = false;
    render();
  }

  function applyTheme() {
    const t = S().theme;
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    const meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0a0907');
  }

  function render() {
    scrollMemory[lastKey] = window.scrollY;
    const key = viewKey();
    let html;
    const session = activeSession();
    const summary = state.ui.summaryId ? sById(state.ui.summaryId) : null;
    if (summary) {
      html = viewSummary(summary);
    } else if (session) {
      html = viewSession(session);
    } else {
      const v = currentView();
      const tab = state.ui.tab;
      if (v.view === 'templateEditor') html = viewTemplateEditor(v.id);
      else if (v.view === 'templateHistory') html = viewTemplateHistory(v.id);
      else if (v.view === 'session') html = viewSessionDetail(v.id);
      else if (v.view === 'progress') html = viewProgress(v.id);
      else if (tab === 'templates') html = viewTemplates();
      else if (tab === 'history') html = viewHistory();
      else if (tab === 'settings') html = viewSettings();
      else html = viewHome();
      const tabs = [['home', 'home', 'homeFill', 'Accueil'], ['templates', 'dumbbell', 'dumbbellFill', 'Séances'], ['history', 'chart', 'chartFill', 'Historique'], ['settings', 'gear', 'gearFill', 'Réglages']];
      const ti = Math.max(0, tabs.findIndex((t) => t[0] === tab));
      html += `<div class="tabbar-fade" aria-hidden="true"></div><nav class="tabbar" aria-label="Navigation" data-seg="tabbar" style="--i:${ti}"><span class="indicator" aria-hidden="true"></span>${tabs.map(([id, ic, icOn, l]) => `<button class="tab" data-action="tab" data-tab="${id}" ${tab === id ? 'aria-current="page"' : ''}>${icon(ic, 'ic-off')}${icon(icOn, 'ic-on')}<span>${l}</span></button>`).join('')}</nav>`;
    }
    html += renderSheet();
    // Mémorise la position des curseurs (onglets, segmentés) pour les faire glisser
    const prevSeg = {};
    root.querySelectorAll('[data-seg]').forEach((el) => { prevSeg[el.dataset.seg] = el.style.getPropertyValue('--i'); });
    const sheetWasOpen = !!root.querySelector('.sheet');
    root.innerHTML = html;
    root.querySelectorAll('[data-seg]').forEach((el) => {
      const was = prevSeg[el.dataset.seg], now = el.style.getPropertyValue('--i');
      if (was !== undefined && was !== now) {
        el.style.setProperty('--i', was);
        void el.offsetWidth;
        el.style.setProperty('--i', now);
      }
    });
    // Une feuille déjà ouverte ne rejoue pas son animation d'entrée à chaque rendu
    if (sheetWasOpen) root.querySelectorAll('.sheet, .scrim').forEach((el) => { el.style.animation = 'none'; });
    if (navAnim && key !== lastKey) {
      root.querySelectorAll('.page, .large-title').forEach((el) => el.classList.add(`anim-${navAnim}`));
    }
    navAnim = '';
    window.scrollTo(0, scrollMemory[key] || 0);
    lastKey = key;
    onScroll();
    if (state.ui.justSet) setTimeout(() => { state.ui.justSet = null; }, 0);
    updateIsland();

    const auto = root.querySelector('.sheet [autofocus]');
    if (auto) { try { auto.focus({ preventScroll: true }); } catch (_) { auto.focus(); } }
    if (key.startsWith('settings:root')) updatePersistStatus();
    syncWakeLock();
  }

  async function updatePersistStatus() {
    const el = document.getElementById('persist-status');
    if (!el) return;
    try {
      const ok = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
      el.textContent = ok ? 'Oui' : 'Non garanti';
    } catch (_) { el.textContent = 'Non garanti'; }
  }

  // Mise à jour en direct (chrono, timer) sans tout redessiner
  function tick() {
    const s = activeSession();
    if (s) {
      const el = root.querySelector('[data-live="elapsed"]');
      if (el) el.textContent = fmtElapsed(Date.now() - ts(s.startedAt));
    }
    if (state.rest.endAt) {
      const remainingMs = state.rest.endAt - Date.now();
      if (remainingMs <= 0) { restFinished(-remainingMs); return; }
      const t = root.querySelector('[data-live="restTime"]');
      if (t) t.textContent = fmtClock(remainingMs / 1000);
      const frac = state.rest.duration > 0 ? clamp(remainingMs / state.rest.duration, 0, 1) : 0;
      document.querySelectorAll('[data-live="restRing"]').forEach((ring) => {
        const C = Number(ring.dataset.c);
        ring.setAttribute('stroke-dashoffset', (C * (1 - frac)).toFixed(2));
      });
    }
    updateIsland();
  }

  // Toast : sur un iPhone à îlot (app installée), la notification jaillit de l'îlot.
  let toastTimer = null;
  function toast(text, tone = '', sub = '') {
    if (islandMode) {
      islandNotice = { text, tone, sub, until: Date.now() + 2800 };
      islandExpanded = false;
      updateIsland();
      clearTimeout(toastTimer);
      toastTimer = setTimeout(updateIsland, 2900);
      return;
    }
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const el = document.createElement('div');
    el.className = `toast ${tone}`;
    el.setAttribute('role', 'status');
    el.innerHTML = `${tone === 'gold' ? icon('trophy') : icon('check')}<span>${esc(text)}</span>`;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2600);
  }

  // ---------------------------------------------------------------------
  // Îlot dynamique
  // Une Live Activity native (ActivityKit) est réservée aux apps Swift :
  // une web app ne peut pas écrire dans l'îlot hors de l'app. Quand l'app
  // est ouverte, on pose une capsule noire exactement sur l'îlot matériel
  // et on l'anime comme une Live Activity (chrono, repos, records).
  // ---------------------------------------------------------------------
  const islandEl = document.getElementById('island');
  let islandMode = false, islandNotice = null, islandExpanded = false, islandExpandedAt = 0, islandKind = '';
  function detectIsland() {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
    document.body.appendChild(probe);
    const top = probe.offsetHeight;
    probe.remove();
    const forced = /[?&]island=1\b/.test(location.search);
    islandMode = forced || (isStandalone() && top >= 50 && Math.min(screen.width, screen.height) < 500);
    document.documentElement.style.setProperty('--isl-top', `${top >= 62 ? 14 : 11}px`);
  }
  function updateIsland() {
    if (!islandMode) { if (islandEl.className !== 'island') islandEl.className = 'island'; return; }
    const now = Date.now();
    const s = activeSession();
    if (islandNotice && islandNotice.until < now) islandNotice = null;
    if (islandExpanded && (!restRunning() || now - islandExpandedAt > 7000)) islandExpanded = false;
    let kind = 'off', cls = 'island';
    if (islandNotice) { kind = `notice:${islandNotice.text}`; cls += ' on expanded'; }
    else if (s && restRunning() && islandExpanded) { kind = 'restFull'; cls += ' on expanded tall'; }
    else if (s && restRunning()) { kind = 'rest'; cls += ' on compact'; }
    else if (s) { kind = 'session'; cls += ' on compact'; }
    if (kind !== islandKind) {
      islandKind = kind;
      const C = 2 * Math.PI * 8;
      const ring = `<svg class="mini-ring" viewBox="0 0 22 22" aria-hidden="true"><circle class="track" cx="11" cy="11" r="8"/><circle class="prog" data-live="restRing" data-c="${C.toFixed(3)}" cx="11" cy="11" r="8" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="0"/></svg>`;
      let html = '';
      if (kind.startsWith('notice')) {
        const n = islandNotice;
        html = `<div class="body"><span class="bi ${n.tone === 'gold' ? 'gold' : ''}">${icon(n.tone === 'gold' ? 'trophy' : n.tone === 'rest' ? 'bolt' : 'check')}</span><div class="bt"><b>${esc(n.text)}</b>${n.sub ? `<small>${esc(n.sub)}</small>` : ''}</div></div>`;
      } else if (kind === 'restFull') {
        html = `<div class="body"><span class="bi">${ring}</span><div class="bt"><b>Repos</b><small>${esc(s.templateNameSnapshot)}</small></div><div class="big" data-isl="rest"></div></div>
          <div class="ctrls"><button data-isl-action="minus" aria-label="Retirer 15 secondes">−15 s</button><button data-isl-action="plus" aria-label="Ajouter 15 secondes">+15 s</button><button class="gold" data-isl-action="skip" aria-label="Passer le repos">${icon('skip')}</button></div>`;
      } else if (kind === 'rest') {
        html = `<div class="lead">${ring}</div><div class="trail" data-isl="rest"></div>`;
      } else if (kind === 'session') {
        html = `<div class="lead">${icon('dumbbellFill')}</div><div class="trail" data-isl="elapsed"></div>`;
      }
      islandEl.innerHTML = html;
    }
    if (islandEl.className !== cls) islandEl.className = cls;
    const restEl = islandEl.querySelector('[data-isl="rest"]');
    if (restEl && state.rest.endAt) restEl.textContent = fmtClock((state.rest.endAt - now) / 1000);
    const elEl = islandEl.querySelector('[data-isl="elapsed"]');
    if (elEl && s) elEl.textContent = fmtElapsed(now - ts(s.startedAt));
    if (state.rest.endAt) {
      const frac = state.rest.duration > 0 ? clamp((state.rest.endAt - now) / state.rest.duration, 0, 1) : 0;
      islandEl.querySelectorAll('[data-live="restRing"]').forEach((r) => r.setAttribute('stroke-dashoffset', (Number(r.dataset.c) * (1 - frac)).toFixed(2)));
    }
  }
  islandEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-isl-action]');
    if (b) {
      const a = b.dataset.islAction;
      if (a === 'skip') { stopRest(); islandExpanded = false; }
      else addRest(a === 'plus' ? 15 : -15);
      islandExpandedAt = Date.now();
      vibrate(8);
      render();
      return;
    }
    if (islandNotice) { islandNotice = null; updateIsland(); return; }
    if (restRunning()) { islandExpanded = !islandExpanded; islandExpandedAt = Date.now(); vibrate(10); updateIsland(); return; }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Confettis dorés quand des records tombent
  function confetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('div');
    c.className = 'confetti';
    c.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 48; i += 1) {
      const el = document.createElement('i');
      el.style.left = `${Math.random() * 100}%`;
      el.style.width = `${5 + Math.random() * 6}px`;
      el.style.setProperty('--x', `${Math.random() * 160 - 80}px`);
      el.style.setProperty('--r', `${Math.random() * 900 - 450}deg`);
      el.style.setProperty('--d', `${1.8 + Math.random() * 1.6}s`);
      el.style.setProperty('--delay', `${Math.random() * 0.5}s`);
      c.appendChild(el);
    }
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4300);
  }

  // Titre large qui se replie, barre en verre au défilement
  function onScroll() {
    const y = window.scrollY;
    document.body.classList.toggle('scrolled', y > 4);
    document.body.classList.toggle('collapsed', y > 44);
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  // ---------------------------------------------------------------------
  // Gestion des actions (délégation d'événements)
  // ---------------------------------------------------------------------
  function sessionRefs(d) {
    const s = activeSession();
    if (!s) return null;
    const se = findSE(s, d.se);
    if (!se) return null;
    const set = d.set ? se.sets.find((x) => x.id === d.set) : null;
    return { s, se, set };
  }

  function openExerciseEditor(t, te) {
    openSheet({
      type: 'exercise', templateId: t.id, teId: te ? te.id : null,
      form: te
        ? { name: te.name, plannedSets: te.plannedSets, repMin: te.repMin, repMax: te.repMax, restSeconds: te.restSeconds, note: te.note || '' }
        : { name: '', plannedSets: 3, repMin: 8, repMax: 10, restSeconds: 120, note: '' },
    });
  }

  function openSetEditor(s, se, set) {
    const ph = placeholder(set, se, s);
    const reps = set.reps ?? ph.reps;
    const weight = set.weight ?? ph.weight;
    openSheet({
      type: 'set', seId: se.id, setId: set.id,
      form: { reps: reps != null ? String(reps) : '', weight: weight != null ? editNum(fromKg(weight)) : '', isWarmup: set.isWarmup, wasCompleted: set.isCompleted },
    });
  }
  function applySetForm() {
    const sh = state.ui.sheet;
    const refs = sessionRefs({ se: sh.seId, set: sh.setId });
    if (!refs || !refs.set) return null;
    const reps = parseNum(sh.form.reps), weight = parseNum(sh.form.weight);
    refs.set.reps = reps != null && reps > 0 ? Math.round(reps) : null;
    refs.set.weight = weight != null && weight >= 0 ? toKg(weight) : null;
    refs.set.isWarmup = !!sh.form.isWarmup;
    return refs;
  }

  const actions = {
    tab(d) {
      if (state.ui.tab === d.tab && !stack().length) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (state.ui.tab === d.tab && stack().length) { state.ui.stacks[d.tab] = []; navAnim = 'pop'; } // retaper l'onglet = revenir à sa racine
      else navAnim = 'tab';
      vibrate(6);
      state.ui.tab = d.tab;
      state.ui.reorder = false;
      render();
    },
    back,
    closeSheet,
    sheetRun(d) {
      const fn = sheetHandlers[d.key];
      state.ui.sheet = null; sheetHandlers = {};
      if (fn) fn(); else render();
    },
    promptSubmit() {
      const v = (document.getElementById('prompt-input') || {}).value || '';
      const fn = sheetHandlers.submit;
      state.ui.sheet = null; sheetHandlers = {};
      if (fn) fn(v); else render();
    },

    // Accueil
    loadDemo() {
      loadDemo();
      commit();
      toast('Données de démo ajoutées');
    },
    dismissInstall() { S().installHintDismissed = true; save(); render(); },
    statsMode(d) { state.ui.statsVolume = d.value === 'volume'; render(); },
    chooseTemplate() {
      const current = (activeTemplates().find((t) => t.id === state.ui.chosenTemplateId) || suggestedTemplate() || {}).id;
      openMenu('Choisir la séance', activeTemplates().map((t) => ({ label: t.name, icon: t.id === current ? 'check' : 'dumbbell', on: t.id === current, run: () => { state.ui.chosenTemplateId = t.id; render(); } })));
    },
    start(d) {
      if (activeSession()) return;
      const t = tById(d.id);
      if (!t || !orderedTE(t).length) return;
      unlockAudio();
      startSession(t);
      state.ui.chosenTemplateId = null;
      vibrate(30);
      commit();
      window.scrollTo(0, 0);
    },
    openSession(d) { push('session', d.id); },
    openProgress(d) { push('progress', d.te); },
    openTemplateHistory(d) { push('templateHistory', d.id); },

    // Types de séances
    newTemplate() {
      openPrompt({ title: 'Nouveau type de séance', placeholder: 'Nom (ex. Push A)', confirm: 'Créer' }, (name) => {
        const t = createTemplate(name);
        state.ui.tab = 'templates';
        state.ui.stacks.templates = [{ view: 'templateEditor', id: t.id }];
        commit();
      });
    },
    openTemplate(d) { push('templateEditor', d.id); },
    toggleReorder() { state.ui.reorder = !state.ui.reorder; render(); },
    moveTemplate(d) { moveTemplate(d.id, Number(d.dir)); commit(); },
    templateMenu(d) {
      const t = tById(d.id);
      if (!t) return;
      openMenu(t.name, [
        { label: 'Modifier', icon: 'note', run: () => push('templateEditor', t.id) },
        { label: 'Dupliquer', icon: 'copy', run: () => { duplicateTemplate(t); commit(); toast('Type de séance dupliqué'); } },
        { label: 'Supprimer', icon: 'trash', danger: true, run: () => actions.deleteTemplate({ id: t.id }) },
      ]);
    },
    deleteTemplate(d) {
      const t = tById(d.id);
      if (!t) return;
      const used = templateHasHistory(t);
      openConfirm({ title: `Supprimer « ${t.name} » ?`, message: used ? "Ses séances passées restent consultables dans l'Historique." : "Ce type n'a encore jamais été utilisé.", confirm: 'Supprimer' }, () => {
        deleteTemplate(t);
        if (currentView().view === 'templateEditor') stack().pop();
        commit();
      });
    },
    newTE(d) { const t = tById(d.t); if (t) openExerciseEditor(t, null); },
    editTE(d) { const t = tById(d.t); const te = t && t.exercises.find((e) => e.id === d.id); if (te) openExerciseEditor(t, te); },
    moveTE(d) { const t = tById(d.t); if (t) { moveTE(t, d.id, Number(d.dir)); commit(); } },
    formStep(d) {
      const f = state.ui.sheet.form;
      f[d.key] = clamp(f[d.key] + Number(d.step), Number(d.lo), Number(d.hi));
      if (d.key === 'repMin' && f.repMax < f.repMin) f.repMax = f.repMin;
      if (d.key === 'repMax' && f.repMin > f.repMax) f.repMin = f.repMax;
      render();
    },
    pickName(d) { state.ui.sheet.form.name = d.name; render(); },
    saveTE() {
      const sh = state.ui.sheet;
      const t = tById(sh.templateId);
      if (!t) { closeSheet(); return; }
      const f = sh.form;
      const finalName = existingName(cleanName(f.name), allExerciseNames(sh.teId)) || cleanName(f.name);
      if (!finalName) return;
      const values = { name: finalName, plannedSets: f.plannedSets, repMin: f.repMin, repMax: f.repMax, restSeconds: f.restSeconds, note: f.note.trim() };
      if (sh.teId) {
        Object.assign(t.exercises.find((e) => e.id === sh.teId) || {}, values);
      } else {
        t.exercises.push({ id: uid(), orderIndex: Math.max(-1, ...t.exercises.map((e) => e.orderIndex)) + 1, isArchived: false, ...values });
        reindexTE(t);
      }
      state.ui.sheet = null;
      vibrate(20);
      commit();
    },
    deleteTE() {
      const sh = state.ui.sheet;
      const t = tById(sh.templateId);
      const te = t && t.exercises.find((e) => e.id === sh.teId);
      if (!te) return;
      openConfirm({ title: `Supprimer « ${te.name} » ?`, message: teHasHistory(te.id) ? 'Son historique sera conservé.' : '', confirm: 'Supprimer' }, () => { deleteTE(t, te); commit(); });
    },

    // Séance en cours
    toggleSet(d) {
      const refs = sessionRefs(d);
      if (!refs || !refs.set) return;
      const { s, se, set } = refs;
      unlockAudio();
      if (set.isCompleted) {
        set.isCompleted = false; set.completedAt = null;
        vibrate(10);
        commit();
        return;
      }
      const ph = placeholder(set, se, s);
      const reps = set.reps ?? ph.reps;
      if (!(reps > 0)) { openSetEditor(s, se, set); return; } // rien à recopier : saisie
      set.reps = reps;
      if (set.weight == null) set.weight = ph.weight ?? 0;
      completeSet(s, se, set);
      state.ui.justSet = set.id;
      commit();
    },
    editSet(d) {
      const refs = sessionRefs(d);
      if (refs && refs.set) { unlockAudio(); openSetEditor(refs.s, refs.se, refs.set); }
    },
    bump(d) {
      const f = state.ui.sheet.form;
      const step = Number(d.step);
      const next = Math.max(0, Math.round(((parseNum(f[d.field]) || 0) + step) * 100) / 100);
      f[d.field] = d.field === 'reps' ? String(Math.round(next)) : editNum(next);
      const input = document.getElementById(d.field === 'reps' ? 'set-reps' : 'set-weight');
      if (input) input.value = f[d.field];
      const btn = document.getElementById('set-validate');
      if (btn) btn.disabled = !((parseNum(f.reps) || 0) > 0);
      vibrate(8);
    },
    toggleWarmup(d, el) {
      const f = state.ui.sheet.form;
      f.isWarmup = !f.isWarmup;
      el.setAttribute('aria-checked', String(f.isWarmup));
      const h = root.querySelector('.sheet-head h2');
      if (h) h.textContent = f.isWarmup ? 'Échauffement' : 'Série';
    },
    validateSet() {
      const refs = applySetForm();
      state.ui.sheet = null;
      if (!refs) { render(); return; }
      if (!refs.set.isCompleted && (refs.set.reps || 0) > 0) { completeSet(refs.s, refs.se, refs.set); state.ui.justSet = refs.set.id; }
      commit();
    },
    keepSet() { applySetForm(); state.ui.sheet = null; commit(); },
    removeSet() {
      const sh = state.ui.sheet;
      const refs = sessionRefs({ se: sh.seId, set: sh.setId });
      state.ui.sheet = null;
      if (refs && refs.set) {
        refs.se.sets = orderedSets(refs.se).filter((x) => x.id !== refs.set.id);
        refs.se.sets.forEach((x, i) => { x.orderIndex = i; });
      }
      commit();
    },
    addSet(d) {
      const refs = sessionRefs(d);
      if (!refs) return;
      refs.se.sets.push({ id: uid(), orderIndex: refs.se.sets.length, reps: null, weight: null, isWarmup: false, isCompleted: false, completedAt: null });
      vibrate(10);
      commit();
    },
    applySuggestion(d) {
      const refs = sessionRefs(d);
      if (!refs) return;
      const sug = suggestion(refs.se, refs.s);
      if (!sug) return;
      for (const x of refs.se.sets) if (!x.isCompleted && !x.isWarmup) x.weight = sug.target;
      vibrate(10);
      commit();
    },
    exerciseMenu(d) {
      const refs = sessionRefs(d);
      if (!refs) return;
      const { se } = refs;
      openMenu(se.nameSnapshot, [
        { label: se.note ? 'Modifier la note' : 'Ajouter une note', icon: 'note', run: () => openPrompt({ title: 'Note de l\'exercice', placeholder: 'Ex. siège cran 4', value: se.note || '', confirm: 'Enregistrer', multiline: true }, (v) => { se.note = v.trim(); commit(); }) },
        { label: 'Ajouter une série', icon: 'plus', run: () => actions.addSet({ se: se.id }) },
      ]);
    },
    restAdd(d) { addRest(Number(d.sec)); vibrate(8); render(); },
    restSkip() { stopRest(); vibrate(8); render(); },
    sessionMenu() {
      openMenu('Séance', [{ label: 'Abandonner la séance', icon: 'x', danger: true, run: () => actions.abandonPrompt() }]);
    },
    abandonPrompt() {
      openConfirm({ title: 'Abandonner la séance ?', message: 'Elle sera supprimée, sans impact sur ton historique.', confirm: 'Abandonner' }, () => {
        const s = activeSession();
        if (s) removeSession(s.id);
        stopRest();
        commit();
      });
    },
    finishPrompt() {
      const s = activeSession();
      if (!s) return;
      const any = s.exercises.some((se) => se.sets.some((x) => x.isCompleted || (x.reps || 0) > 0));
      if (!any) {
        openConfirm({ title: 'Aucune série validée', message: 'Rien ne sera enregistré.', confirm: 'Abandonner la séance' }, () => { removeSession(s.id); stopRest(); commit(); });
        return;
      }
      openConfirm({ title: 'Terminer la séance ?', message: 'Les séries vides ne seront pas enregistrées.', confirm: 'Abandonner la séance', extra: 'Terminer et enregistrer' },
        () => { removeSession(s.id); stopRest(); commit(); },
        () => { finishSession(s); stopRest(); state.ui.summaryId = s.id; vibrate([30, 60, 30]); commit(); window.scrollTo(0, 0); if (recordCount(s)) setTimeout(confetti, 250); });
    },
    closeSummary() { state.ui.summaryId = null; render(); },

    // Historique
    deleteSession(d) {
      openConfirm({ title: 'Supprimer cette séance ?', message: 'Elle disparaîtra de ton historique et de tes stats.', confirm: 'Supprimer' }, () => {
        removeSession(d.id);
        stack().pop();
        commit();
      });
    },
    metric(d) { state.ui.metric = d.value; render(); },

    // Réglages
    setSetting(d) { S()[d.key] = d.value; save(); applyTheme(); render(); },
    toggleSetting(d) { S()[d.key] = !S()[d.key]; save(); render(); },
    exportJSON() { exportJSON(); },
    exportCSV() { exportCSV(); },
    importJSON() { const input = document.getElementById('import-file'); if (input) input.click(); },
    deleteAll() {
      openConfirm({ title: 'Tout effacer ?', message: 'Pense à exporter une sauvegarde avant. Cette action est irréversible.', confirm: 'Effacer définitivement' }, () => {
        state.data = { version: 1, templates: [], sessions: [] };
        state.ui.stacks = { home: [], templates: [], history: [], settings: [] };
        stopRest();
        commit();
        toast('Données effacées');
      });
    },
  };

  // Clics
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || !root.contains(el) || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
  });
  document.addEventListener('pointerdown', unlockAudio, { passive: true });

  // Saisies : on met à jour l'état sans redessiner (pour garder le focus)
  document.addEventListener('input', (e) => {
    const el = e.target;
    const sh = state.ui.sheet;
    if (el.id === 'ex-name' && sh) {
      sh.form.name = el.value;
      const box = document.getElementById('ex-suggest');
      if (box) box.innerHTML = nameSuggestHTML(el.value, sh.teId);
      const btn = root.querySelector('[data-action="saveTE"]');
      if (btn) btn.disabled = !cleanName(el.value);
    } else if (el.id === 'ex-note' && sh) {
      sh.form.note = el.value;
    } else if ((el.id === 'set-reps' || el.id === 'set-weight') && sh) {
      sh.form[el.id === 'set-reps' ? 'reps' : 'weight'] = el.value;
      const btn = document.getElementById('set-validate');
      if (btn) btn.disabled = !((parseNum(sh.form.reps) || 0) > 0);
    } else if (el.dataset.input === 'templateName') {
      const t = tById(el.dataset.id);
      if (t) { t.name = el.value; save(); const h = root.querySelector('.nav-title'); if (h) h.textContent = el.value || 'Type de séance'; }
    }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'ex-rest' && state.ui.sheet) state.ui.sheet.form.restSeconds = Number(el.value);
    else if (el.dataset.setting) { S()[el.dataset.setting] = Number(el.value); save(); }
    else if (el.dataset.input === 'templateName') {
      const t = tById(el.dataset.id);
      if (t) { if (!t.name.trim()) t.name = 'Séance sans nom'; t.name = t.name.trim(); commit(); }
    } else if (el.id === 'import-file' && el.files && el.files[0]) {
      const file = el.files[0];
      el.value = '';
      file.text().then((text) => {
        let backup;
        try { backup = parseBackup(text); } catch (err) { toast(err.message || 'Fichier illisible'); return; }
        openConfirm({ title: 'Remplacer toutes les données ?', message: `La sauvegarde contient ${plural(backup.templates.length, 'type')} de séances et ${plural(backup.sessions.length, 'séance')}. Tes données actuelles seront remplacées.`, confirm: 'Remplacer' }, () => {
          state.data = backup;
          state.ui.stacks = { home: [], templates: [], history: [], settings: [] };
          commit();
          toast('Sauvegarde restaurée');
        });
      });
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'prompt-input' && e.target.tagName === 'INPUT') { e.preventDefault(); actions.promptSubmit(); }
    if (e.key === 'Escape' && state.ui.sheet) closeSheet();
  });

  // Feuilles : glisser la poignée vers le bas pour fermer
  let drag = null;
  document.addEventListener('pointerdown', (e) => {
    const sheet = e.target.closest('.sheet');
    if (!sheet || !e.target.closest('.grabber, .sheet-head') || e.target.closest('button')) return;
    drag = { sheet, y0: e.clientY, dy: 0, t0: Date.now() };
    sheet.classList.add('dragging');
  }, { passive: true });
  document.addEventListener('pointermove', (e) => {
    if (!drag) return;
    drag.dy = Math.max(0, e.clientY - drag.y0);
    drag.sheet.style.transform = `translateY(${drag.dy}px)`;
  }, { passive: true });
  const endDrag = () => {
    if (!drag) return;
    const { sheet, dy, t0 } = drag;
    drag = null;
    sheet.classList.remove('dragging');
    const speed = dy / Math.max(1, Date.now() - t0);
    if (dy > 110 || (speed > 0.6 && dy > 30)) {
      sheet.style.transition = 'transform 0.22s ease-in';
      sheet.style.transform = 'translateY(110%)';
      setTimeout(closeSheet, 200);
    } else {
      sheet.style.transition = 'transform 0.45s cubic-bezier(.32,1.28,.5,1)';
      sheet.style.transform = '';
    }
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  // Retour : balayer depuis le bord gauche (comme une app iOS)
  let edge = null;
  document.addEventListener('touchstart', (e) => {
    if (state.ui.sheet || state.ui.summaryId || activeSession() || !stack().length) return;
    const t = e.touches[0];
    if (t.clientX > 24) return;
    edge = { x0: t.clientX, y0: t.clientY, dx: 0, els: [...root.querySelectorAll('.page, .nav')], horizontal: null };
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!edge) return;
    const t = e.touches[0];
    const dx = t.clientX - edge.x0, dy = t.clientY - edge.y0;
    if (edge.horizontal === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) edge.horizontal = Math.abs(dx) > Math.abs(dy);
    if (!edge.horizontal) return;
    edge.dx = Math.max(0, dx);
    edge.els.forEach((el) => { el.style.transition = 'none'; el.style.transform = `translateX(${edge.dx}px)`; el.style.opacity = String(1 - Math.min(0.5, edge.dx / 700)); });
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!edge) return;
    const { dx, els } = edge;
    edge = null;
    if (dx > 90) { vibrate(8); back(); return; }
    els.forEach((el) => { el.style.transition = 'transform 0.35s cubic-bezier(.32,1.28,.5,1), opacity 0.3s'; el.style.transform = ''; el.style.opacity = ''; });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
    else tick();
    syncWakeLock();
  });
  window.addEventListener('pagehide', flush);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------
  async function boot() {
    await loadPersisted();
    dataVersion += 1;
    detectIsland();
    applyTheme();
    if (state.rest.endAt && state.rest.endAt <= Date.now()) stopRest();
    render();
    setInterval(tick, 250);
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) { /* rien */ }
  }
  boot();
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
